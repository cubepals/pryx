services:
  - type: web
    name: pryx
    runtime: image
    image:
      url: ghcr.io/cubepals/pryx:0.1.0
    plan: standard
    healthCheckPath: /healthz
    disk:
      name: pryx-state
      mountPath: /var/lib/pryx
      sizeGB: 10
    envVars:
      - key: PRYX_BOOTSTRAP_API_KEY
        generateValue: true
      - key: PRYX_HOSTING_PLATFORM
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: pryx-database
          property: connectionString
databases:
  - name: pryx-database
    plan: basic-256mb
