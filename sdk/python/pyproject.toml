[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cubepals-pryx"
version = "0.1.0"
description = "The pryx public sandbox client"
requires-python = ">=3.12"
license = "LicenseRef-FSL-1.1-ALv2"
dependencies = ["httpx==0.28.1", "attrs==26.1.0", "python-dateutil==2.9.0.post0"]

[tool.setuptools.packages.find]
where = ["src"]
