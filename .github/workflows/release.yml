name: Release

# A commit on main whose CI passed, and whose Cargo.toml version has no tag yet, is a release:
# v<version> is tagged on that commit, and the binary, its signature by the release key, its specs,
# its deploy files and its licence are published, attested, as an immutable GitHub Release and as
# ghcr.io/cubepals/pryxd:<version>.
# Any other commit does nothing. Agents never push tags; this does.
on:
  # Safe here: the job runs only for CI on a push to this repository's main, never a fork's run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is this version released?
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The commit CI passed on, or main's head when run by hand.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$version" > /dev/null; then
            echo "v$version is out already."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    # The release key is this environment's secret, which only main may use: a run of a workflow
    # edited on a branch can't read it.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/cubepals/pryxd
      RELEASE_IMAGE: ghcr.io/cubepals/pryx
      TEMPLATE_IMAGE: ghcr.io/cubepals/pryx-sandbox-agent
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Build
        run: docker build -t "$IMAGE:$version" .
      - name: The binary says its version, and the files
        run: |
          [ "$(docker run --rm "$IMAGE:$version" --version)" = "pryxd $version" ]
          mkdir -p dist
          id=$(docker create "$IMAGE:$version")
          for f in pryxd usr/local/lib/pryx/pryx-agent openapi/node-reads.openapi.json openapi/node-writes.openapi.json \
                   deploy/daemon.json deploy/pryxd.service LICENSE.md; do
            docker cp "$id:/$f" "dist/$(basename "$f")"
          done
          docker cp "$id:/usr/local/lib/pryx/agentos/agentos-runtime-sidecar-linux-x64-gnu/agentos-native-sidecar" dist/agentos-native-sidecar
          docker cp "$id:/licenses/CDLA-Permissive-2.0.txt" dist/webpki-roots-LICENSE.txt
          docker cp "$id:/licenses/webpki-roots.NOTICE" dist/webpki-roots-NOTICE.txt
          mkdir -p "$RUNNER_TEMP/agentos-assets"
          for f in agentos-core licenses NOTICE distribution.json; do
            docker cp "$id:/usr/local/lib/pryx/agentos/$f" "$RUNNER_TEMP/agentos-assets/$f"
          done
          tar -C "$RUNNER_TEMP/agentos-assets" -czf dist/agentos-assets-linux-x64.tar.gz .
          docker rm "$id" > /dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build service binaries and pack SDKs
        run: |
          bun run release:build
          bun pm pack --cwd sdk/typescript --destination ../../dist
          bun run --cwd integrations/rivet build
          bun pm pack --cwd integrations/rivet --destination ../../dist
          cp control/openapi/pryx.openapi.json control/openapi/edge.openapi.json dist/
          python3 -m venv .venv-python
          .venv-python/bin/pip install build==1.3.0
          .venv-python/bin/python -m build sdk/python --outdir dist
      # What a node checks before it upgrades (src/upgrade/trust.rs): the version and the binary's
      # sha256, signed with a key whose public half is in deploy/release-keys.pem, or no node would
      # take the release.
      - name: Sign the version and the binary's sha256
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          [ -n "$RELEASE_KEY" ] || { echo "The release environment has no PRYXD_RELEASE_KEY."; exit 1; }
          printf 'pryxd release\n%s\n%s\n' "$version" "$(sha256sum dist/pryxd | cut -d' ' -f1)" > statement
          printf '%s\n' "$RELEASE_KEY" | openssl pkey -pubout -out release-key.pub
          grep -qxF "$(sed -n 2p release-key.pub)" deploy/release-keys.pem ||
            { echo "PRYXD_RELEASE_KEY's public half isn't in deploy/release-keys.pem."; exit 1; }
          printf '%s\n' "$RELEASE_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in statement -out dist/pryxd.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in statement -sigfile dist/pryxd.sig
          bun control/tools/join-bootstrap.ts dist/pryxd dist/pryx-agent "$RUNNER_TEMP/join-bootstrap.statement"
          printf '%s\n' "$RELEASE_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in "$RUNNER_TEMP/join-bootstrap.statement" -out dist/pryxd.bootstrap.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$RUNNER_TEMP/join-bootstrap.statement" -sigfile dist/pryxd.bootstrap.sig
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      # Beside the binary in the image too, for the control plane that carries it to pass on.
      - name: Put the signature in the image
        run: printf 'FROM %s\nCOPY pryxd.sig /pryxd.sig\nCOPY pryxd.bootstrap.sig /pryxd.bootstrap.sig\n' "$IMAGE:$version" | docker build -q -t "$IMAGE:$version" -f - dist
      - name: Pack and sign the ordinary-user runtime
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          started=$(date +%s)
          printf 'FROM %s\nCOPY deploy/bundle.py deploy/postgresql.json /source/deploy/\nRUN python3 /source/deploy/bundle.py /bundle\n' "$IMAGE:$version" > "$RUNNER_TEMP/host-bundle.Dockerfile"
          docker build -t pryx-release-host-bundle -f "$RUNNER_TEMP/host-bundle.Dockerfile" .
          id=$(docker create pryx-release-host-bundle)
          docker cp "$id:/bundle/." dist/
          docker rm -v "$id"
          key=$(mktemp)
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          bun control/tools/bundle-sign.ts dist "$key"
          digest=$(sha256sum dist/pryx-bundle-linux-x64.tar.gz | cut -d' ' -f1)
          printf 'pryx host bundle\n%s\n%s\n' "$version" "$digest" > "$RUNNER_TEMP/host-bundle.statement"
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$RUNNER_TEMP/host-bundle.statement" -sigfile dist/pryx-bundle-linux-x64.tar.gz.sig
          (cd dist && sha256sum -- * > SHA256SUMS)
          du -h dist/pryx-*-linux-x64.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Additional host bundle packaging: $(($(date +%s)-started)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push the image
        id: push
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push -q "$IMAGE:$version"
          docker tag "$IMAGE:$version" "$RELEASE_IMAGE:$version"
          docker push -q "$RELEASE_IMAGE:$version"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$version@$digest"
      - name: Build and publish the sandbox-agent template
        id: template
        run: |
          docker build -t "$TEMPLATE_IMAGE:$version" integrations/rivet/template
          docker push -q "$TEMPLATE_IMAGE:$version"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$TEMPLATE_IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish the interpreter templates
        run: |
          for template in python-interpreter node-interpreter; do
            image="ghcr.io/cubepals/pryx-$template:$version"
            docker build -t "$image" "templates/$template"
            docker push -q "$image"
          done
      - name: Build and publish native tool templates
        run: |
          image="ghcr.io/cubepals/pryx-tools:$version"
          docker build -t "$image" -f templates/native-tools/Dockerfile .
          docker push -q "$image"
          docker build -t "ghcr.io/cubepals/pryx-desktop:$version" --build-arg "NATIVE_IMAGE=$image" templates/desktop
          docker push -q "ghcr.io/cubepals/pryx-desktop:$version"
          docker build -t "ghcr.io/cubepals/pryx-browser:$version" templates/browser
          docker push -q "ghcr.io/cubepals/pryx-browser:$version"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.TEMPLATE_IMAGE }}
          subject-digest: ${{ steps.template.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.RELEASE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Drafted with every file, then published: an immutable release can't take files after.
      - name: Publish the release
        env:
          digest: ${{ steps.push.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          pryxd $version, under FSL-1.1-ALv2 (LICENSE.md).

          Image: \`$IMAGE:$version@$digest\`

          Check a file or the image:
          \`\`\`sh
          gh attestation verify pryxd -R $GITHUB_REPOSITORY
          gh attestation verify oci://$IMAGE:$version -R $GITHUB_REPOSITORY
          \`\`\`

          \`pryxd.sig\` is the release key's signature that nodes check before they upgrade
          (the README's "Verify a release").
          NOTES
          gh release create "v$version" dist/* --draft --target "$SHA" \
            --title "pryxd $version" --notes-file notes.md
          gh release edit "v$version" --draft=false --latest
