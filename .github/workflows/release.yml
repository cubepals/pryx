name: Release

# A commit on main whose CI passed, and whose Cargo.toml version has no tag yet, is a release:
# v<version> is tagged on that commit, and the binary, its signature by the release key, its specs,
# its deploy files and its licence are published, attested, as an immutable GitHub Release and as
# ghcr.io/cubepals/pryxd:<version>, one image for x86_64 and aarch64. x86_64's files keep their
# first names; aarch64's carry the machine after the stem (pryxd-linux-arm64.sig), each built
# natively on GitHub's standard runner for it.
# Any other commit does nothing. Agents never push tags; this does.
on:
  # Safe here: the job runs only for CI on a push to this repository's main, never a fork's run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      experimental:
        description: Include separately signed experimental archives in this new main release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Is this version released?
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
      lab: ${{ github.event_name == 'workflow_dispatch' && inputs.experimental && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # The commit CI passed on, or main's head when run by hand.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$version" > /dev/null; then
            echo "v$version is out already."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI on the requested main release
        if: github.event_name == 'workflow_dispatch' && inputs.experimental && steps.version.outputs.new == 'true'
        timeout-minutes: 120
        run: |
          # A dispatch can reserve the new version while its main CI is running. The ordinary
          # release waits in the existing concurrency group and later sees the published tag.
          for _ in {1..12}; do
            run=$(gh run list --workflow ci.yml --event push --branch main --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -z "$run" ] || break
            sleep 5
          done
          [ -n "$run" ] || { echo "No main push CI run for this commit"; exit 1; }
          while :; do
            status=$(gh run view "$run" --json status,conclusion --jq 'if .status == "completed" then .conclusion else "waiting" end')
            [ "$status" = waiting ] || break
            sleep 30
          done
          [ "$status" = success ] || { echo "Main CI ended with $status for $SHA"; exit 1; }

  # aarch64's programs, signatures, host bundle and image, built on GitHub's standard arm64 runner.
  # The process tool and VM bundles stay x86_64's: pryxd on aarch64 says why those are off.
  arm64:
    name: Build the aarch64 files and image
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.result == 'success' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04-arm
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cubepals/pryxd
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Build the release image and take its programs
        run: |
          test "$(uname -m)" = aarch64
          docker build -t "$IMAGE:$version-linux-arm64" .
          [ "$(docker run --rm "$IMAGE:$version-linux-arm64" --version)" = "pryxd $version" ]
          mkdir arm64
          id=$(docker create "$IMAGE:$version-linux-arm64")
          for f in pryxd:pryxd usr/local/lib/pryx/pryx-agent:pryx-agent usr/local/bin/pryx:pryx \
                   opt/pryx/pryx-control:pryx-control opt/pryx/pryx-edge:pryx-edge; do
            docker cp "$id:/${f%%:*}" "arm64/${f#*:}"
          done
          docker rm "$id" > /dev/null
          file arm64/* | tee /dev/stderr | grep -c 'ARM aarch64' | grep -qx 5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Sign the version and the aarch64 binary's sha256
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          [ -n "$RELEASE_KEY" ] || { echo "The release environment has no PRYXD_RELEASE_KEY."; exit 1; }
          printf 'pryxd release\n%s\n%s\n' "$version" "$(sha256sum arm64/pryxd | cut -d' ' -f1)" > statement
          printf '%s\n' "$RELEASE_KEY" | openssl pkey -pubout -out release-key.pub
          grep -qxF "$(sed -n 2p release-key.pub)" deploy/release-keys.pem ||
            { echo "PRYXD_RELEASE_KEY's public half isn't in deploy/release-keys.pem."; exit 1; }
          printf '%s\n' "$RELEASE_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in statement -out arm64/pryxd.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in statement -sigfile arm64/pryxd.sig
          bun control/tools/join-bootstrap.ts arm64/pryxd arm64/pryx-agent "$RUNNER_TEMP/join-bootstrap.statement"
          printf '%s\n' "$RELEASE_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in "$RUNNER_TEMP/join-bootstrap.statement" -out arm64/pryxd.bootstrap.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$RUNNER_TEMP/join-bootstrap.statement" -sigfile arm64/pryxd.bootstrap.sig
      - name: Put the signature in the image
        run: printf 'FROM %s\nCOPY pryxd.sig /pryxd.sig\nCOPY pryxd.bootstrap.sig /pryxd.bootstrap.sig\n' "$IMAGE:$version-linux-arm64" | docker build -q -t "$IMAGE:$version-linux-arm64" -f - arm64
      - name: Pack and sign the ordinary-user runtime
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          printf 'FROM %s\nCOPY deploy/bundle.py deploy/postgresql.json /source/deploy/\nRUN python3 /source/deploy/bundle.py /bundle\n' "$IMAGE:$version-linux-arm64" > "$RUNNER_TEMP/host-bundle.Dockerfile"
          docker build -t pryx-release-host-bundle -f "$RUNNER_TEMP/host-bundle.Dockerfile" .
          id=$(docker create pryx-release-host-bundle)
          docker cp "$id:/bundle/." arm64/
          docker rm -v "$id"
          key=$(mktemp)
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          bun control/tools/bundle-sign.ts arm64 "$key"
          digest=$(sha256sum arm64/pryx-bundle-linux-arm64.tar.gz | cut -d' ' -f1)
          printf 'pryx host bundle\n%s\n%s\n' "$version" "$digest" > "$RUNNER_TEMP/host-bundle.statement"
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$RUNNER_TEMP/host-bundle.statement" -sigfile arm64/pryx-bundle-linux-arm64.tar.gz.sig
      - name: Name the files for aarch64
        run: |
          mkdir dist
          for f in pryxd pryx-agent pryx pryx-control pryx-edge; do cp "arm64/$f" "dist/$f-linux-arm64"; done
          cp arm64/pryxd.sig dist/pryxd-linux-arm64.sig
          cp arm64/pryxd.bootstrap.sig dist/pryxd-linux-arm64.bootstrap.sig
          cp arm64/pryx-bundle-linux-arm64.tar.gz arm64/pryx-bundle-linux-arm64.tar.gz.sig arm64/pryx-bootstrap-linux-arm64.tar.gz dist/
          du -h dist/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the optional static arm64 lab archive
        if: needs.version.outputs.lab == 'true'
        run: |
          rustup target add aarch64-unknown-linux-musl
          sh experimental/install/build-release.sh arm64 "$RUNNER_TEMP/lab-arm64"
      - name: Sign the optional arm64 lab archive
        if: needs.version.outputs.lab == 'true'
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          archive="$RUNNER_TEMP/lab-arm64/pryx-lab-linux-arm64.pyz"
          printf '%s\n' "$RELEASE_KEY" | python3 -B experimental/install/sign.py "$archive" "$archive.sig" \
            --key /dev/stdin --public-key release-key.pub --version "$version" --arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.version.outputs.lab == 'true'
        with:
          name: release-experimental-arm64
          path: |
            ${{ runner.temp }}/lab-arm64/pryx-lab-linux-arm64.pyz
            ${{ runner.temp }}/lab-arm64/pryx-lab-linux-arm64.pyz.sig
          if-no-files-found: error
      - name: Push the aarch64 image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push -q "$IMAGE:$version-linux-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arm64
          path: dist/
          if-no-files-found: error

  release:
    needs: [version, arm64]
    if: github.ref == 'refs/heads/main' && needs.version.result == 'success' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-24.04
    # This workflow checks the main ref before either signing job requests the release
    # environment. Its environment secret supplies the existing signing key.
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/cubepals/pryxd
      RELEASE_IMAGE: ghcr.io/cubepals/pryx
      TEMPLATE_IMAGE: ghcr.io/cubepals/pryx-sandbox-agent
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Assemble the separate native tool distributions
        # Native tools are separate lazy assets; only their digest descriptor enters the image.
        # Source archives, recipes and patches are retained unchanged as data.
        run: |
          mkdir -p dist
          python3 templates/process-tools/build.py --cache "$RUNNER_TEMP/tool-inputs" --output "$RUNNER_TEMP/process-tools"
          python3 templates/process-tools/sources.py --runtime "$RUNNER_TEMP/process-tools" \
            --cache "$RUNNER_TEMP/tool-inputs" --output "$RUNNER_TEMP/process-tool-sources" \
            --archive dist/pryx-process-tools-sources.tar.gz \
            --descriptor "$RUNNER_TEMP/process-tool-sources.json"
          python3 templates/process-tools/package.py --root "$RUNNER_TEMP/process-tools" \
            --archive dist/pryx-process-tools-linux-x64.tar.gz \
            --descriptor deploy/process-tools/process-tools.json \
            --url "https://github.com/cubepals/pryx/releases/download/v$version/pryx-process-tools-linux-x64.tar.gz"
      - name: Assemble the separate VM distributions
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          export PRYX_VM_RELEASE_BASE_URL="https://github.com/cubepals/pryx/releases/download/v$version"
          bash templates/vm-tools/release.sh dist
      - name: Build the release image
        run: docker build -t "$IMAGE:$version" .
      - name: The binary says its version, and the files
        run: |
          [ "$(docker run --rm "$IMAGE:$version" --version)" = "pryxd $version" ]
          mkdir -p dist
          id=$(docker create "$IMAGE:$version")
          # The server preset installs vm-bundle.json beside pryx-agent when the release lists it.
          for f in pryxd usr/local/lib/pryx/pryx-agent usr/local/lib/pryx/vm-bundle.json \
                   openapi/node-reads.openapi.json openapi/node-writes.openapi.json \
                   deploy/daemon.json deploy/pryxd.service LICENSE.md; do
            docker cp "$id:/$f" "dist/$(basename "$f")"
          done
          python3 - dist/vm-bundle.json "dist/pryx-vm-linux-x64.tar.gz" "$version" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          runtime = json.loads(Path(sys.argv[1]).read_text())
          archive = Path(sys.argv[2])
          assert runtime['url'] == f'https://github.com/cubepals/pryx/releases/download/v{sys.argv[3]}/{archive.name}'
          assert runtime['bytes'] == archive.stat().st_size
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == runtime['sha256']
          PY
          docker cp "$id:/usr/local/lib/pryx/agentos/agentos-runtime-sidecar-linux-x64-gnu/agentos-native-sidecar" dist/agentos-native-sidecar
          docker cp "$id:/licenses/CDLA-Permissive-2.0.txt" dist/webpki-roots-LICENSE.txt
          docker cp "$id:/licenses/webpki-roots.NOTICE" dist/webpki-roots-NOTICE.txt
          mkdir -p "$RUNNER_TEMP/agentos-assets"
          for f in agentos-core licenses NOTICE distribution.json; do
            docker cp "$id:/usr/local/lib/pryx/agentos/$f" "$RUNNER_TEMP/agentos-assets/$f"
          done
          tar -C "$RUNNER_TEMP/agentos-assets" -czf dist/agentos-assets-linux-x64.tar.gz .
          docker rm "$id" > /dev/null
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build service binaries and pack SDKs
        run: |
          bun run release:build
          bun pm pack --cwd sdk/typescript --destination ../../dist
          bun run --cwd integrations/rivet build
          bun pm pack --cwd integrations/rivet --destination ../../dist
          cp control/openapi/pryx.openapi.json control/openapi/edge.openapi.json dist/
          # The server preset takes every file by its machine's name; the control assets are the same.
          cp dist/pryx-control-assets.tar.gz dist/pryx-control-assets-linux-arm64.tar.gz
          python3 -m venv .venv-python
          .venv-python/bin/pip install build==1.3.0
          .venv-python/bin/python -m build sdk/python --outdir dist
      - name: Fetch the aarch64 files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-arm64
          path: dist
          digest-mismatch: error
      # What a node checks before it upgrades (src/upgrade/trust.rs): the version and the binary's
      # sha256, signed with a key whose public half is in deploy/release-keys.pem, or no node would
      # take the release.
      - name: Sign the version and the binary's sha256
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          [ -n "$RELEASE_KEY" ] || { echo "The release environment has no PRYXD_RELEASE_KEY."; exit 1; }
          printf 'pryxd release\n%s\n%s\n' "$version" "$(sha256sum dist/pryxd | cut -d' ' -f1)" > statement
          printf '%s\n' "$RELEASE_KEY" | openssl pkey -pubout -out release-key.pub
          grep -qxF "$(sed -n 2p release-key.pub)" deploy/release-keys.pem ||
            { echo "PRYXD_RELEASE_KEY's public half isn't in deploy/release-keys.pem."; exit 1; }
          printf '%s\n' "$RELEASE_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in statement -out dist/pryxd.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in statement -sigfile dist/pryxd.sig
          bun control/tools/join-bootstrap.ts dist/pryxd dist/pryx-agent "$RUNNER_TEMP/join-bootstrap.statement"
          printf '%s\n' "$RELEASE_KEY" | openssl pkeyutl -sign -inkey /dev/stdin -rawin -in "$RUNNER_TEMP/join-bootstrap.statement" -out dist/pryxd.bootstrap.sig
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$RUNNER_TEMP/join-bootstrap.statement" -sigfile dist/pryxd.bootstrap.sig
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      # Beside the binary in the image too, for the control plane that carries it to pass on.
      - name: Put the signature in the image
        run: printf 'FROM %s\nCOPY pryxd.sig /pryxd.sig\nCOPY pryxd.bootstrap.sig /pryxd.bootstrap.sig\n' "$IMAGE:$version" | docker build -q -t "$IMAGE:$version" -f - dist
      - name: Pack and sign the ordinary-user runtime
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          started=$(date +%s)
          printf 'FROM %s\nCOPY deploy/bundle.py deploy/postgresql.json /source/deploy/\nRUN python3 /source/deploy/bundle.py /bundle\n' "$IMAGE:$version" > "$RUNNER_TEMP/host-bundle.Dockerfile"
          docker build -t pryx-release-host-bundle -f "$RUNNER_TEMP/host-bundle.Dockerfile" .
          id=$(docker create pryx-release-host-bundle)
          docker cp "$id:/bundle/." dist/
          docker rm -v "$id"
          key=$(mktemp)
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          bun control/tools/bundle-sign.ts dist "$key"
          digest=$(sha256sum dist/pryx-bundle-linux-x64.tar.gz | cut -d' ' -f1)
          printf 'pryx host bundle\n%s\n%s\n' "$version" "$digest" > "$RUNNER_TEMP/host-bundle.statement"
          openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$RUNNER_TEMP/host-bundle.statement" -sigfile dist/pryx-bundle-linux-x64.tar.gz.sig
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum -- * > SHA256SUMS)
          du -h dist/pryx-*-linux-x64.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Additional host bundle packaging: $(($(date +%s)-started)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      # Stage the requested assets after the stock manifest is complete and before provenance
      # and publication. A published immutable release cannot be extended.
      - name: Build the optional static x64 lab archive
        if: needs.version.outputs.lab == 'true'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sh experimental/install/build-release.sh x64 dist
      - name: Sign the optional x64 lab archive
        if: needs.version.outputs.lab == 'true'
        env:
          RELEASE_KEY: ${{ secrets.PRYXD_RELEASE_KEY }}
        run: |
          archive=dist/pryx-lab-linux-x64.pyz
          printf '%s\n' "$RELEASE_KEY" | python3 -B experimental/install/sign.py "$archive" "$archive.sig" \
            --key /dev/stdin --public-key release-key.pub --version "$version" --arch x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.version.outputs.lab == 'true'
        with:
          name: release-experimental-arm64
          path: dist
          digest-mismatch: error
      # One index for both machines, under both names; the aarch64 job pushed its half.
      - name: Push the image
        id: push
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$version" "$IMAGE:$version-linux-amd64"
          docker push -q "$IMAGE:$version-linux-amd64"
          for name in "$IMAGE" "$RELEASE_IMAGE"; do
            docker buildx imagetools create -t "$name:$version" "$IMAGE:$version-linux-amd64" "$IMAGE:$version-linux-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:$version"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$(docker buildx imagetools inspect "$RELEASE_IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)" = "$digest" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$version@$digest"
      - name: Build and publish the sandbox-agent template
        id: template
        run: |
          docker build -t "$TEMPLATE_IMAGE:$version" integrations/rivet/template
          docker push -q "$TEMPLATE_IMAGE:$version"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$TEMPLATE_IMAGE:$version" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and publish the interpreter templates
        run: |
          for template in python-interpreter node-interpreter; do
            image="ghcr.io/cubepals/pryx-$template:$version"
            docker build -t "$image" "templates/$template"
            docker push -q "$image"
          done
      - name: Build and publish native tool templates
        run: |
          image="ghcr.io/cubepals/pryx-tools:$version"
          docker build -t "$image" -f templates/native-tools/Dockerfile .
          docker push -q "$image"
          docker build -t "ghcr.io/cubepals/pryx-desktop:$version" --build-arg "NATIVE_IMAGE=$image" templates/desktop
          docker push -q "ghcr.io/cubepals/pryx-desktop:$version"
          docker build -t "ghcr.io/cubepals/pryx-browser:$version" templates/browser
          docker push -q "ghcr.io/cubepals/pryx-browser:$version"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.TEMPLATE_IMAGE }}
          subject-digest: ${{ steps.template.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.RELEASE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Drafted with every file, then published: an immutable release can't take files after.
      - name: Publish the release
        env:
          digest: ${{ steps.push.outputs.digest }}
        run: |
          cat > notes.md <<NOTES
          pryxd $version, under FSL-1.1-ALv2 (LICENSE.md).

          Image: \`$IMAGE:$version@$digest\`

          Check a file or the image:
          \`\`\`sh
          gh attestation verify pryxd -R $GITHUB_REPOSITORY
          gh attestation verify oci://$IMAGE:$version -R $GITHUB_REPOSITORY
          \`\`\`

          \`pryxd.sig\` is the release key's signature that nodes check before they upgrade
          (the README's "Verify a release").
          NOTES
          gh release create "v$version" dist/* --draft --target "$SHA" \
            --title "pryxd $version" --notes-file notes.md
          gh release edit "v$version" --draft=false --latest
