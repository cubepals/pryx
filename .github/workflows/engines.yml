name: Rootless engines

on:
  # A dispatch on a worker branch (k and a digit, or codex/) proves it, with the branch's own copy
  # of this file. That branch's push starts a run whose jobs all skip: it takes no runner and only
  # cancels a proof of an older commit. any-host's push runs every job.
  workflow_dispatch:
    inputs:
      policy_cost:
        description: Run only the opt-in process-policy baseline on both native architectures
        type: boolean
        default: false
  push:
    branches: [any-host, 'k[0-9]*', 'codex/**']
    # A push that changes only documentation proves nothing new here; normal CI still runs.
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths:
      - 'src/**'
      - 'tests/docker*'
      - 'tests/docker/**'
      - 'Cargo.*'
      - '.github/engine-versions.json'
      - '.github/workflows/engines.yml'
      - 'scripts/setup-test-engine.sh'
      - 'scripts/engine-ownership.py'
      - 'scripts/engine-api-probe.py'
      - 'scripts/engine-ownership-second.py'
      - 'tests/engine_ownership.py'
      - 'tests/fixtures/ingress-service.c'
      - 'tests/fixtures/rootless-bridge-failure.json'
      - '.github/k22-ownership.json'
      - 'agent/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On a worker branch only its newest commit needs proving: its push cancels an older proof.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/k') || startsWith(github.ref, 'refs/heads/codex/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  engine:
    name: Rootless ${{ matrix.engine }}
    # A worker branch's push skips this, and so does a pull request from a worker branch of this
    # repository: a dispatch on that branch proves its commits. Forks, other branches, any-host's
    # push and dispatches run it as before.
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.policy_cost) &&
      (github.event_name != 'push' || github.ref == 'refs/heads/any-host') && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'k0') || startsWith(github.head_ref, 'k1') ||
        startsWith(github.head_ref, 'k2') || startsWith(github.head_ref, 'k3') ||
        startsWith(github.head_ref, 'k4') || startsWith(github.head_ref, 'k5') ||
        startsWith(github.head_ref, 'k6') || startsWith(github.head_ref, 'k7') ||
        startsWith(github.head_ref, 'k8') || startsWith(github.head_ref, 'k9') ||
        startsWith(github.head_ref, 'codex/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRYX_PROBE_DIAGNOSTICS: '1'
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release compilation space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Rust from rust-toolchain.toml
        id: rust
        run: |
          rustup toolchain install
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: engine-${{ matrix.engine }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            engine-${{ matrix.engine }}-${{ steps.rust.outputs.version }}-
            test-${{ steps.rust.outputs.version }}-
      - name: Start the engine as the runner user
        run: bash scripts/setup-test-engine.sh "${{ matrix.engine }}"
      - name: Read bounded engine metadata timings
        run: timeout 20s python3 scripts/engine-api-probe.py
      - name: Real engine controller and cold sleep cases
        env:
          PRYX_ENGINE_MEASUREMENTS: ${{ runner.temp }}/engine-measurements.json
        run: cargo test --locked --test docker engine -- --ignored --test-threads 1
      - name: Static protected ingress fixture
        if: matrix.engine == 'docker'
        run: |
          RUSTFLAGS='-C target-feature=+crt-static' cargo build --locked -p pryx-agent --bin pryx-agent --target x86_64-unknown-linux-gnu
          echo "PRYX_INTERNAL_INGRESS_AGENT=$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/debug/pryx-agent" >> "$GITHUB_ENV"
      - name: Real rootless private ingress transport
        if: matrix.engine == 'docker'
        run: |
          echo "Kernel protected-exec policy:"
          cat /proc/sys/fs/suid_dumpable || true
          cargo test --locked -p pryxd --lib engine_private_exec_ingress -- --ignored --test-threads 1
      - name: Measure default, host and keep-id data ownership
        if: ${{ !cancelled() && env.DOCKER_HOST != '' }}
        run: python3 scripts/engine-ownership.py
      - name: Measure second data-owner alternatives
        if: ${{ !cancelled() && matrix.engine == 'docker' && env.DOCKER_HOST != '' }}
        run: |
          python3 tests/engine_ownership.py
          image=$(jq -er '.image.reference' .github/engine-versions.json)
          python3 scripts/engine-ownership-second.py --manifest .github/k22-ownership.json --image "$image" --output "$RUNNER_TEMP/ownership-second.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rootless-${{ matrix.engine }}-measurements
          path: |
            ${{ runner.temp }}/engine-measurements.json
            ${{ runner.temp }}/ownership-second.json
          if-no-files-found: warn
          retention-days: 7
      - name: Bounded engine diagnostics on failure
        if: failure()
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          path="$RUNNER_TEMP/pryx-engine-$ENGINE/engine.log"
          if [ -f "$path" ]; then tail -100 "$path"; fi

  policy-cost:
    if: github.event_name == 'workflow_dispatch' && inputs.policy_cost
    name: Process policy baseline on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the process policy benchmark
        run: |
          rustup toolchain install
          python3 -B experimental/policy/trace_test.py
          cargo test --locked --manifest-path experimental/policy/Cargo.toml --features experimental
          cargo build --locked --release --manifest-path experimental/policy/Cargo.toml --features experimental
      - name: Measure the existing installed seccomp stack
        run: |
          mkdir -p "$RUNNER_TEMP/policy"
          git rev-parse HEAD > "$RUNNER_TEMP/policy/commit"
          uname -a > "$RUNNER_TEMP/policy/kernel"
          lscpu --json > "$RUNNER_TEMP/policy/cpu.json"
          lscpu --caches > "$RUNNER_TEMP/policy/caches"
          rustc -vV > "$RUNNER_TEMP/policy/rust"
          cat /proc/meminfo > "$RUNNER_TEMP/policy/meminfo"
          findmnt --target "$RUNNER_TEMP" > "$RUNNER_TEMP/policy/filesystem"
          if test -r /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor; then
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor > "$RUNNER_TEMP/policy/governor"
          fi
          binary=experimental/policy/target/release/pryx-policy-cost
          "$binary" verify > "$RUNNER_TEMP/policy/equivalence"
          "$binary" candidate cache 1 > "$RUNNER_TEMP/policy/candidate-cache"
          "$binary" host cache 1 > "$RUNNER_TEMP/policy/host-cache"
          "$binary" process cache 1 > "$RUNNER_TEMP/policy/process-cache"
          python3 experimental/policy/seccomp.py "$binary" > "$RUNNER_TEMP/policy/seccomp.json"
      - name: Verify and exercise the stock cgroup program object
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18
          case "$(uname -m)" in
            aarch64) arch=arm64; digest=b53ff306dc1d51d64f13a2b717f6ba5687a3613b87277ad0108464cf7b886cb7 ;;
            x86_64) arch=amd64; digest=51ffd3dd4f46fdc46736433a971e828dc70835c6b18ad20cabffd10abcf00358 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/bpftool.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/libbpf/bpftool/releases/download/v7.6.0/bpftool-v7.6.0-$arch.tar.gz"
          echo "$digest  $archive" | sha256sum -c -
          mkdir -m 700 "$RUNNER_TEMP/policy-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/policy-tools" bpftool
          bpftool="$RUNNER_TEMP/policy-tools/bpftool"
          llvm-objdump-18 --version > "$RUNNER_TEMP/policy/llvm"
          "$bpftool" version > "$RUNNER_TEMP/policy/bpftool"
          sudo python3 experimental/policy/network.py "$RUNNER_TEMP/policy/network" --verify --skb --bpftool "$bpftool"
      - name: Count original BPF instructions in disposable packet test runs
        run: |
          sudo env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            python3 -B experimental/policy/run_coverage.py bpf/network.bpf.o "$RUNNER_TEMP/policy/trace" \
              --bpftool "$RUNNER_TEMP/policy-tools/bpftool"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: policy-baseline-${{ matrix.runner }}
          path: ${{ runner.temp }}/policy/
          if-no-files-found: error
