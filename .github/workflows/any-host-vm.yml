name: VM experiments

on:
  schedule:
    - cron: '23 5 * * 2'
  # A dispatch on a worker branch (k and a digit, or codex/) proves it, with the branch's own copy
  # of this file. That branch's push starts a run whose jobs all skip: it takes no runner and only
  # cancels a proof of an older commit. any-host's push runs every job.
  workflow_dispatch:
    inputs:
      measure_pryx:
        description: Record paired VM boot timings and balloon reporting counters
        type: boolean
        default: false
  push:
    branches: [any-host, 'k[0-9]*', 'codex/**']
    # A push that changes only documentation proves nothing new here; normal CI still runs.
    paths-ignore: ['docs/**', '**.md']
  # A pull request that changes VM code runs the KVM acceptance too; any other starts no run.
  pull_request:
    paths:
      - '.github/workflows/any-host-vm.yml'
      - 'templates/vm-tools/**'
      - 'vm-image/**'
      - 'deploy/vm/**'
      - 'src/runtime/vm.rs'
      - 'src/runtime/vm/**'
      - 'src/config/vm.rs'
      - 'src/probe/kvm.rs'
      - 'agent/src/vm_*.rs'
      - 'agent/src/vm_*/**'
      - 'agent/src/transfer_target.rs'
      - 'agent/tests/vm_*.rs'
      - 'tests/vm.rs'

# Pushes and the schedule share their branch's group; a dispatch has its own, but on a worker
# branch it shares the push group, so the branch's newest push or proof cancels an older proof; each
# pull request has its own, where a newer commit stops the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && !(startsWith(github.ref, 'refs/heads/k') || startsWith(github.ref, 'refs/heads/codex/')) && 'dispatch-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/k') || startsWith(github.ref, 'refs/heads/codex/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  inputs:
    name: Published kernel and network spikes
    # A worker branch's push skips this and so memory, and so does a pull request from a worker
    # branch of this repository: a dispatch on that branch proves its commits. Forks, other
    # branches, any-host's push, dispatches and the schedule run it as before.
    if: >-
      (github.event_name != 'push' || github.ref == 'refs/heads/any-host') && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'k0') || startsWith(github.head_ref, 'k1') ||
        startsWith(github.head_ref, 'k2') || startsWith(github.head_ref, 'k3') ||
        startsWith(github.head_ref, 'k4') || startsWith(github.head_ref, 'k5') ||
        startsWith(github.head_ref, 'k6') || startsWith(github.head_ref, 'k7') ||
        startsWith(github.head_ref, 'k8') || startsWith(github.head_ref, 'k9') ||
        startsWith(github.head_ref, 'codex/')))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.measure_pryx && 45 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hash primary published archives without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" inventory
      - name: Prepare pinned separate experiment tools
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" tools
      - name: Inspect published kernels and their archive configurations
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" inspect
      - name: Build the typed configuration and static guest probe
        working-directory: templates/vm-tools
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" configurator
      - name: Build and relocate the unchanged VM filesystem component
        id: filesystems
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" filesystems
      - name: Allow the ordinary runner user to open real KVM
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test "$(id -u)" -ne 0
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot EROFS overlay and vsock thirty times
        run: |
          python3 templates/vm-tools/kernel.py \
            --inspection "$RUNNER_TEMP/vm-archive-inspection.json" \
            --staged "$RUNNER_TEMP/vm-selected-files" \
            --configurator "$RUNNER_TEMP/vm-config" --guest "$RUNNER_TEMP/vm-guest" \
            --filesystem-component "$RUNNER_TEMP/vm-filesystem-component" \
            --work "$RUNNER_TEMP/vm-kernel-spike" \
            --output "$RUNNER_TEMP/vm-kernel-spike.json" | tee "$RUNNER_TEMP/vm-kernel-spike.log"
      - name: Prepare immutable network comparison inputs
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" network-inputs
      - name: Build maintained network wrappers and guest forwarder
        working-directory: templates/vm-tools/network
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" network
      - name: Permit user namespaces on the positive comparison runner
        id: network-prerequisites
        run: |
          # This disposable fixture compares a capability's positive path; product setup changes no host policy.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe tun
          test -c /dev/net/tun
      - name: Compare pasta TAP and maintained vsock networking
        run: |
          python3 templates/vm-tools/network_compare.py \
            --inspection "$RUNNER_TEMP/vm-archive-inspection.json" --staged "$RUNNER_TEMP/vm-selected-files" \
            --configurator "$RUNNER_TEMP/vm-config" --guest "$RUNNER_TEMP/vm-guest" \
            --mkfs "$RUNNER_TEMP/vm-build-tools/erofs/usr/bin/mkfs.erofs" \
            --inputs "$RUNNER_TEMP/vm-network-inputs" --network-probe "$RUNNER_TEMP/vm-network-probe" \
            --forwarder "$RUNNER_TEMP/vm-gvforwarder" --proxy "$RUNNER_TEMP/vm-network-proxy" \
            --work "$RUNNER_TEMP/vm-network-spike" \
            --output "$RUNNER_TEMP/vm-network-spike.json" | tee "$RUNNER_TEMP/vm-network-spike.log"
      - name: Build the independent pinned CNI TAP experiment
        id: root-network
        working-directory: templates/vm-tools/root-network
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" root-network
      - name: Prove owned TAP creation and ordinary monitor access
        if: ${{ !cancelled() && steps.root-network.outcome == 'success' && steps.network-prerequisites.outcome == 'success' }}
        run: |
          sudo "$RUNNER_TEMP/vm-root-tap-probe" --plugins "$RUNNER_TEMP/vm-root-cni" \
            --uid "$(id -u)" --gid "$(id -g)" | tee "$RUNNER_TEMP/vm-root-tap-probe.json"
      - name: Prove namespace-bound root gateway ownership
        if: ${{ !cancelled() && steps.root-network.outcome == 'success' && steps.network-prerequisites.outcome == 'success' }}
        run: |
          sudo "$RUNNER_TEMP/vm-root-tap-probe" --plugins "$RUNNER_TEMP/vm-root-cni" \
            --uid "$(id -u)" --gid "$(id -g)" --gateways | tee "$RUNNER_TEMP/vm-root-kernel-gateways.json"
      - name: Prove vsock without host user namespaces or TUN
        if: ${{ !cancelled() && steps.network-prerequisites.outcome == 'success' }}
        run: |
          pryx_userns_limit=$(cat /proc/sys/user/max_user_namespaces)
          pryx_tun_mode=$(stat -c '%a' /dev/net/tun)
          restore_pryx_network_prerequisites() {
            sudo sysctl -w "user.max_user_namespaces=$pryx_userns_limit"
            sudo chmod "$pryx_tun_mode" /dev/net/tun
          }
          trap restore_pryx_network_prerequisites EXIT
          sudo sysctl -w user.max_user_namespaces=0
          sudo chmod 000 /dev/net/tun
          python3 templates/vm-tools/network_compare.py --without-host-prerequisites \
            --inspection "$RUNNER_TEMP/vm-archive-inspection.json" --staged "$RUNNER_TEMP/vm-selected-files" \
            --configurator "$RUNNER_TEMP/vm-config" --guest "$RUNNER_TEMP/vm-guest" \
            --mkfs "$RUNNER_TEMP/vm-build-tools/erofs/usr/bin/mkfs.erofs" \
            --inputs "$RUNNER_TEMP/vm-network-inputs" --network-probe "$RUNNER_TEMP/vm-network-probe" \
            --forwarder "$RUNNER_TEMP/vm-gvforwarder" --proxy "$RUNNER_TEMP/vm-network-proxy" \
            --work "$RUNNER_TEMP/vm-network-prerequisites" \
            --output "$RUNNER_TEMP/vm-network-prerequisites.json" | tee "$RUNNER_TEMP/vm-network-prerequisites.log"
      - name: Prepare the repository Rust for real OCI acceptance
        id: vm-rust
        if: ${{ !cancelled() && steps.filesystems.outcome == 'success' }}
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.vm-rust.outcome == 'success' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: vm-inputs-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vm-image/Cargo.lock') }}
          restore-keys: vm-inputs-
      - name: Prove ordinary host VM process policies
        if: ${{ !cancelled() && steps.vm-rust.outcome == 'success' }}
        env:
          PRYX_VM_HOST_PROXY: ${{ runner.temp }}/vm-network-proxy
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          cargo test --locked -p pryx-agent --lib vm_policy::tests -- --nocapture | tee "$RUNNER_TEMP/vm-host-policy.log"
          cargo test --locked -p pryx-agent --test vm_monitor -- --include-ignored --nocapture | tee -a "$RUNNER_TEMP/vm-host-policy.log"
      - name: Build the actual static agent and trusted bootstrap
        id: vm-bootstrap
        if: ${{ !cancelled() && steps.vm-rust.outcome == 'success' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" bootstrap
      - name: Retain complete published-kernel sources and exact recipes
        id: vm-sources
        if: ${{ !cancelled() && steps.filesystems.outcome == 'success' }}
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" sources
      - name: Build the same-source confined native monitor and its complete sources
        id: vm-native-monitor
        if: ${{ !cancelled() && steps.vm-sources.outcome == 'success' && steps.vm-rust.outcome == 'success' }}
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" native-monitor
      - name: Assemble separately inventoried VM runtime and source archives
        id: vm-bundle
        if: ${{ !cancelled() && steps.vm-bootstrap.outcome == 'success' && steps.vm-sources.outcome == 'success' && steps.vm-native-monitor.outcome == 'success' }}
        run: bash "$GITHUB_WORKSPACE/templates/vm-tools/build.sh" bundle
      - name: Verify whole runtime, lazy acquisition and corruption refusals
        if: ${{ !cancelled() && steps.vm-bundle.outcome == 'success' }}
        env:
          PRYX_VM_RUNTIME: ${{ runner.temp }}/vm-runtime
          PRYX_VM_RUNTIME_ARCHIVE: ${{ runner.temp }}/pryx-vm-linux-x64.tar.gz
          PRYX_VM_RUNTIME_DESCRIPTOR: ${{ github.workspace }}/deploy/vm/vm-bundle.json
          PRYX_VM_FILESYSTEM_COMPONENT: ${{ runner.temp }}/vm-filesystem-component
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo test --locked --manifest-path vm-image/Cargo.toml --test bundle -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-bundle-acceptance.log"
      - name: Prove the production VM runtime seam on both OCI images
        if: ${{ !cancelled() && steps.vm-bundle.outcome == 'success' }}
        env:
          PRYX_VM_HOST_PROXY: ${{ runner.temp }}/vm-network-proxy
          PRYX_VM_HOST_LAUNCHER: ${{ runner.temp }}/vm-runtime/bin/vm-launcher
          PRYX_VM_RUNTIME_DIAGNOSTICS: ${{ runner.temp }}/vm-runtime-diagnostics
          PRYX_VM_POLICY_PROBE: ${{ runner.temp }}/vm-network-probe
          PRYX_VM_RUNTIME_DESCRIPTOR: ${{ runner.temp }}/vm-runtime.json
          PRYX_VM_RUNTIME_ARCHIVE: ${{ runner.temp }}/pryx-vm-linux-x64.tar.gz
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked --lib runtime::vm::network::tests -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-network-ownership.log"
          cargo test --locked --lib runtime::vm::instance::tests::actual_runtime_cold_boot_exec_stop_wake_copy_and_fork -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-runtime-acceptance.log"
          if ! command -v strace >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends strace
          fi
          strace --version > "$RUNNER_TEMP/vm-monitor-thread-signals.version.txt"
          strace -f -e trace=tkill,tgkill,ioctl -e signal=none -o "$RUNNER_TEMP/vm-monitor-thread-signals.log" \
            cargo test --locked --lib runtime::vm::instance::shutdown_acceptance::actual_monitor_shutdown_threads_exit_cleanly \
              -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-monitor-shutdown.log"
      - name: Prove root jail disk staging and recovery
        if: ${{ !cancelled() && steps.vm-bundle.outcome == 'success' }}
        env:
          PRYX_VM_RUNTIME_DESCRIPTOR: ${{ runner.temp }}/vm-runtime.json
          PRYX_VM_RUNTIME_ARCHIVE: ${{ runner.temp }}/pryx-vm-linux-x64.tar.gz
          PRYX_VM_RUNTIME_DIAGNOSTICS: ${{ runner.temp }}/vm-root-runtime-diagnostics
          PRYX_VM_POLICY_PROBE: ${{ runner.temp }}/vm-network-probe
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          PRYX_VM_ROOT_TEST_UID=$(id -u)
          PRYX_VM_ROOT_TEST_GID=$(id -g)
          export PRYX_VM_ROOT_TEST_UID PRYX_VM_ROOT_TEST_GID
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER='sudo --preserve-env=PRYX_VM_ROOT_TEST_UID,PRYX_VM_ROOT_TEST_GID,PRYX_VM_RUNTIME_DESCRIPTOR,PRYX_VM_RUNTIME_ARCHIVE,PRYX_VM_RUNTIME_DIAGNOSTICS,PRYX_VM_POLICY_PROBE --'
          cargo test --locked --lib runtime::vm::jail::tests::actual_root_mounts_retire_after_leases_and_recover_without_a_second_disk -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-root-jail.log"
          cargo test --locked --lib runtime::vm::instance::root_acceptance::actual_jailer_boots_both_images_and_recovers_the_original_disk -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-root-runtime.log"
          cargo test --locked --lib runtime::vm::instance::root_lifecycle::actual_root_runtime_cold_boot_files_and_daemon_loss -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-root-lifecycle.log"
      - name: Prove actual VM data through the mutual TLS node API
        if: ${{ !cancelled() && steps.vm-bundle.outcome == 'success' }}
        env:
          PRYX_VM_HOST_LAUNCHER: ${{ runner.temp }}/vm-runtime/bin/vm-launcher
          PRYX_VM_RUNTIME_DESCRIPTOR: ${{ runner.temp }}/vm-runtime.json
          PRYX_VM_RUNTIME_ARCHIVE: ${{ runner.temp }}/pryx-vm-linux-x64.tar.gz
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        # One at a time: each test runs its own node, and two nodes would share one host port range.
        run: cargo test --locked --test vm -- --ignored --nocapture --test-threads 1 | tee "$RUNNER_TEMP/vm-node-api.log"
      - name: Prove a separate bounded root VM authority
        if: ${{ !cancelled() && steps.vm-bundle.outcome == 'success' && steps.root-network.outcome == 'success' }}
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked -p pryxd --lib --no-run --message-format=json > "$RUNNER_TEMP/vm-authority-artifacts.jsonl"
          cargo test --locked -p pryx-agent --test vm_packet_tap --no-run --message-format=json > "$RUNNER_TEMP/vm-packet-artifacts.jsonl"
          python3 templates/vm-tools/root_authority.py --cargo-artifacts "$RUNNER_TEMP/vm-authority-artifacts.jsonl" \
            --packet-artifacts "$RUNNER_TEMP/vm-packet-artifacts.jsonl" \
            --work "$RUNNER_TEMP/vm-root-authority"
      - name: Hand redacted root monitor diagnostics to artifact upload
        if: always()
        env:
          PRYX_VM_ROOT_DIAGNOSTICS: ${{ runner.temp }}/vm-root-runtime-diagnostics
        run: |
          if sudo test -d "$PRYX_VM_ROOT_DIAGNOSTICS"; then
            sudo chown -R "$(id -u):$(id -g)" "$PRYX_VM_ROOT_DIAGNOSTICS"
          fi
      - name: Prepare real pinned Alpine and Debian OCI layers without an engine
        if: ${{ !cancelled() && steps.vm-rust.outcome == 'success' }}
        env:
          PRYX_VM_FILESYSTEM_COMPONENT: ${{ runner.temp }}/vm-filesystem-component
          PRYX_VM_IMAGE_REPORT: ${{ runner.temp }}/vm-image-acceptance.json
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          PRYX_VM_FILESYSTEM_MANIFEST=$(sha256sum "$PRYX_VM_FILESYSTEM_COMPONENT/filesystem-manifest.json" | cut -d' ' -f1)
          export PRYX_VM_FILESYSTEM_MANIFEST
          cargo test --locked --manifest-path vm-image/Cargo.toml --test registry -- --ignored --nocapture | tee "$RUNNER_TEMP/vm-image-acceptance.log"
      - name: Boot the actual agent on Alpine and Debian and reboot synced disks
        if: ${{ !cancelled() && steps.vm-bootstrap.outcome == 'success' }}
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PRYX_MEASURE_BOOT: ${{ inputs.measure_pryx }}
        run: |
          guest_fixture() {
            python3 templates/vm-tools/agent_acceptance.py \
              --inspection "$RUNNER_TEMP/vm-archive-inspection.json" --staged "$RUNNER_TEMP/vm-selected-files" \
              --configurator "$RUNNER_TEMP/vm-config" --client "$RUNNER_TEMP/vm-agent-client" \
              --host-launcher target/x86_64-unknown-linux-musl/debug/pryx-agent \
              --bootstrap "$RUNNER_TEMP/vm-agent-bootstrap" --proxy "$RUNNER_TEMP/vm-network-proxy" \
              --filesystem-component "$RUNNER_TEMP/vm-filesystem-component" "$@"
          }
          guest_fixture --work "$RUNNER_TEMP/vm-guest-acceptance" | tee "$RUNNER_TEMP/vm-guest-acceptance.log"
          if [ "$PRYX_MEASURE_BOOT" = true ]; then
            guest_fixture --work "$RUNNER_TEMP/vm-boot-benchmark" --measure-boot
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/vm-boot-benchmark/vm-boot-benchmark.md"
          fi
      - name: Retain paired VM boot and page reporting measurements
        if: ${{ !cancelled() && inputs.measure_pryx }}
        uses: ./.github/actions/upload-evidence
        with:
          name: vm-boot-benchmark
          path: |
            ${{ runner.temp }}/vm-boot-benchmark/vm-boot-benchmark.json
            ${{ runner.temp }}/vm-boot-benchmark/vm-boot-benchmark.md
          if-no-files-found: error
      - name: Retain bounded runtime diagnostics separately
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: vm-runtime-diagnostics
          path: |
            ${{ runner.temp }}/vm-runtime-acceptance.log
            ${{ runner.temp }}/vm-host-policy.log
            ${{ runner.temp }}/vm-network-ownership.log
            ${{ runner.temp }}/vm-monitor-thread-signals.log
            ${{ runner.temp }}/vm-monitor-thread-signals.version.txt
            ${{ runner.temp }}/vm-monitor-shutdown.log
            ${{ runner.temp }}/vm-root-jail.log
            ${{ runner.temp }}/vm-root-runtime.log
            ${{ runner.temp }}/vm-root-lifecycle.log
            ${{ runner.temp }}/vm-node-api.log
            ${{ runner.temp }}/vm-root-authority/
            ${{ runner.temp }}/vm-root-runtime-diagnostics/
            ${{ runner.temp }}/vm-runtime-diagnostics/*.serial.log
          if-no-files-found: warn
      - name: Retain candidate identities and actual digests
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: vm-input-inventory
          path: |
            ${{ runner.temp }}/vm-corresponding-sources/inputs.json
            ${{ runner.temp }}/pryx-vm-linux-x64.tar.gz
            ${{ runner.temp }}/vm-network-probe
            ${{ runner.temp }}/pryx-vm-sources.tar.gz
            ${{ runner.temp }}/vm-runtime.json
            ${{ runner.temp }}/vm-sources.json
            ${{ runner.temp }}/vm-bundle.log
            ${{ runner.temp }}/vm-monitor-sdk.log
            ${{ runner.temp }}/vm-native-monitor-build.log
            ${{ runner.temp }}/vm-native-monitor-build/component/monitor.json
            ${{ runner.temp }}/vm-native-monitor-build/component/abi.json
            ${{ runner.temp }}/vm-native-monitor-build/component/policy.json
            ${{ runner.temp }}/vm-native-monitor-build/component/seccomp.json
            ${{ runner.temp }}/vm-native-monitor-build/component/seccomp_filter.bpf
            ${{ runner.temp }}/vm-bundle-acceptance.log
            ${{ runner.temp }}/vm-corresponding-sources.log
            ${{ runner.temp }}/vm-candidate-inventory.json
            ${{ runner.temp }}/vm-input-inventory.log
            ${{ runner.temp }}/vm-archive-inspection.json
            ${{ runner.temp }}/vm-archive-inspection.log
            ${{ runner.temp }}/vm-tool-inputs.log
            ${{ runner.temp }}/vm-filesystem-component.log
            ${{ runner.temp }}/vm-filesystem-check.json
            ${{ runner.temp }}/vm-filesystem-component/filesystem-manifest.json
            ${{ runner.temp }}/vm-filesystem-component/filesystem-inputs.json
            ${{ runner.temp }}/vm-image-acceptance.json
            ${{ runner.temp }}/vm-image-acceptance.log
            ${{ runner.temp }}/vm-cross.log
            ${{ runner.temp }}/vm-agent-bootstrap.log
            ${{ runner.temp }}/vm-agent-bootstrap/bootstrap.json
            ${{ runner.temp }}/vm-guest-acceptance.log
            ${{ runner.temp }}/vm-guest-acceptance/guest-acceptance.json
            ${{ runner.temp }}/vm-guest-acceptance/**/*.serial.log
            ${{ runner.temp }}/vm-guest-acceptance/**/config*.json
            ${{ runner.temp }}/vm-spike-notices
            ${{ runner.temp }}/vm-kernel-spike.json
            ${{ runner.temp }}/vm-kernel-spike.log
            ${{ runner.temp }}/vm-kernel-spike/*.serial.log
            ${{ runner.temp }}/vm-network-inputs.log
            ${{ runner.temp }}/vm-network-notices
            ${{ runner.temp }}/vm-root-network-notices
            ${{ runner.temp }}/vm-root-tap-probe.json
            ${{ runner.temp }}/vm-root-kernel-gateways.json
            ${{ runner.temp }}/vm-network-spike.json
            ${{ runner.temp }}/vm-network-spike.log
            ${{ runner.temp }}/vm-network-spike/**/*.log
            ${{ runner.temp }}/vm-network-spike/**/namespace.json
            ${{ runner.temp }}/vm-network-prerequisites.json
            ${{ runner.temp }}/vm-network-prerequisites.log
            ${{ runner.temp }}/vm-network-prerequisites/**/*.log
          if-no-files-found: error

  # Memory sleep and forks with memory, on their own runner so neither job nears its time limit:
  # the first job took 23 of its 30 minutes with them. They run the VM runtime that job built and
  # retained, unchanged, as an ordinary user with KVM and no other host change.
  memory:
    name: VM memory sleep and forks with memory
    needs: inputs
    # Skipped with the first job (a milestone branch's pull request), whose runtime it needs.
    if: ${{ !cancelled() && needs.inputs.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the VM runtime the first job built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-input-inventory
          path: ${{ runner.temp }}/vm-inputs
          digest-mismatch: error
      - name: Put the runtime, its descriptor and the network probe where the first job had them
        run: |
          cp "$RUNNER_TEMP/vm-inputs/pryx-vm-linux-x64.tar.gz" "$RUNNER_TEMP/vm-inputs/vm-runtime.json" \
            "$RUNNER_TEMP/vm-inputs/vm-network-probe" "$RUNNER_TEMP/"
      - name: Allow the ordinary runner user to open real KVM
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test "$(id -u)" -ne 0
          test -r /dev/kvm && test -w /dev/kvm
      - name: Prepare the repository Rust
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: vm-inputs-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vm-image/Cargo.lock') }}
          restore-keys: vm-inputs-
      - name: Prove memory sleep, its cold-boot fallbacks and forks with memory
        env:
          PRYX_VM_RUNTIME_DIAGNOSTICS: ${{ runner.temp }}/vm-runtime-diagnostics
          PRYX_VM_RUNTIME_DESCRIPTOR: ${{ runner.temp }}/vm-runtime.json
          PRYX_VM_RUNTIME_ARCHIVE: ${{ runner.temp }}/pryx-vm-linux-x64.tar.gz
          PRYX_VM_POLICY_PROBE: ${{ runner.temp }}/vm-network-probe
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        # One at a time, so the sleep and wake samples time one guest's work alone.
        run: cargo test --locked --lib runtime::vm::instance::memory_acceptance -- --ignored --nocapture --test-threads 1 | tee "$RUNNER_TEMP/vm-memory-sleep.log"
      - name: Retain the memory sleep evidence
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: vm-memory-sleep
          path: |
            ${{ runner.temp }}/vm-memory-sleep.log
            ${{ runner.temp }}/vm-runtime-diagnostics/*.serial.log
          if-no-files-found: warn
