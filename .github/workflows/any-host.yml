name: Any host

on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
  # A new workflow cannot be dispatched before main has it. Branch pushes prove this build now.
  push:
    branches: [any-host]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bundle:
    name: Bundle runtime acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release compilation space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Create an isolated preview signing identity
        run: |
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/preview.key"
          openssl pkey -in "$RUNNER_TEMP/preview.key" -pubout -out "$RUNNER_TEMP/preview.pub"
      - name: Build the same programs as the release image
        run: |
          started=$(date +%s)
          docker build --target bundle --build-arg "PRYX_PREVIEW_PUBLIC_KEY=$(cat "$RUNNER_TEMP/preview.pub")" -t pryx-host-bundle .
          mkdir host-artifacts
          id=$(docker create pryx-host-bundle)
          docker cp "$id:/bundle/." host-artifacts/
          docker rm -v "$id"
          docker run --rm --entrypoint /bin/sh pryx-host-bundle -c 'cat /source/deploy/postgresql.json' > host-artifacts/postgresql.json
          docker run --rm --entrypoint /usr/local/bin/pryx pryx-host-bundle --version
          echo "Bundle build: $(($(date +%s)-started)) seconds" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Sign the preview archive and finish its manifest
        run: |
          bun control/tools/bundle-sign.ts host-artifacts "$RUNNER_TEMP/preview.key"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          sed "s/__PRYX_VERSION__/$version/g" deploy/install.sh > host-artifacts/install.sh
          (cd host-artifacts && sha256sum -- * > SHA256SUMS)
          du -h host-artifacts/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Relocation in the image userland
        run: |
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$PWD/host-artifacts,target=/artifacts,readonly" \
            --mount "type=bind,source=$PWD/deploy/bundle-smoke.sh,target=/bundle-smoke.sh,readonly" \
            pryx-host-bundle /bundle-smoke.sh
      - name: Relocation in Alpine with the default profile
        run: |
          docker run --rm --entrypoint /bin/sh \
            --mount "type=bind,source=$PWD/host-artifacts,target=/artifacts,readonly" \
            --mount "type=bind,source=$PWD/deploy/bundle-smoke.sh,target=/bundle-smoke.sh,readonly" \
            mirror.gcr.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf /bundle-smoke.sh
      - name: Split transport below the connector download limit
        id: transport
        run: |
          mkdir host-parts
          tar -cf host-transport.tar -C host-artifacts .
          split --bytes=256M --numeric-suffixes --suffix-length=1 host-transport.tar host-parts/part
          (cd host-parts && sha256sum part* > PARTS.sha256)
          sha256sum host-transport.tar > host-parts/TRANSPORT.sha256
          count=$(find host-parts -name 'part*' -type f | wc -l)
          test "$count" -le 4
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-bundle-preview-0
          path: |
            host-parts/part0
            host-parts/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: fromJSON(steps.transport.outputs.count) > 1
        with:
          name: host-bundle-preview-1
          path: |
            host-parts/part1
            host-parts/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: fromJSON(steps.transport.outputs.count) > 2
        with:
          name: host-bundle-preview-2
          path: |
            host-parts/part2
            host-parts/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: fromJSON(steps.transport.outputs.count) > 3
        with:
          name: host-bundle-preview-3
          path: |
            host-parts/part3
            host-parts/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7


  containers:
    name: Ordinary user in ${{ matrix.distro }} Docker
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian
            image: debian:trixie-slim@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392
          - distro: Ubuntu
            image: mirror.gcr.io/library/ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
          - distro: Fedora
            image: registry.fedoraproject.org/fedora:44@sha256:acb5e2218545b173cb73206435c64cb43d493df508b9d875c2dff1c44c82867f
          - distro: Alpine
            image: mirror.gcr.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          - distro: Alpine with Landlock denied
            image: mirror.gcr.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            mode: unsupported
          - distro: Ubuntu with Landlock denied
            image: mirror.gcr.io/library/ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
            mode: wasm
          - distro: Debian root preset
            image: debian:trixie-slim@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392
            mode: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-bundle-preview-*
          merge-multiple: true
          path: host-parts
      - name: Verify and reconstruct the release transport
        run: |
          (cd host-parts && sha256sum -c PARTS.sha256)
          cat host-parts/part? > host-transport.tar
          sha256sum -c host-parts/TRANSPORT.sha256
          mkdir host-artifacts
          tar -xf host-transport.tar -C host-artifacts
          (cd host-artifacts && sha256sum -c SHA256SUMS)
      - name: One command, hello, repeat, upgrade and purge
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_MODE: ${{ matrix.mode || 'default' }}
        run: |
          profile=()
          if [ "$TEST_MODE" = unsupported ] || [ "$TEST_MODE" = wasm ]; then
            python3 - <<'PY' > unsupported-profile.json
          import errno, json
          print(json.dumps({'defaultAction': 'SCMP_ACT_ALLOW', 'syscalls': [{
            'names': ['landlock_create_ruleset', 'landlock_add_rule', 'landlock_restrict_self'],
            'action': 'SCMP_ACT_ERRNO', 'errnoRet': errno.EPERM}]}))
          PY
            profile=(--security-opt "seccomp=$PWD/unsupported-profile.json")
            if [ "$TEST_MODE" = unsupported ]; then profile+=(-e PRYX_UNSUPPORTED=1)
            else profile+=(-e PRYX_EXPECT_WASM=1); fi
          fi
          if [ "$TEST_MODE" = root ]; then profile+=(-e PRYX_TEST_ROOT_MODE=1 -e PORT=80); fi
          docker run --rm "${profile[@]}" \
            --mount "type=bind,source=$PWD/host-artifacts,target=/artifacts,readonly" \
            --mount "type=bind,source=$PWD/deploy/container-acceptance.sh,target=/container-acceptance.sh,readonly" \
            --mount "type=bind,source=$PWD/deploy/local-acceptance.sh,target=/local-acceptance.sh,readonly" \
            --mount "type=bind,source=$PWD/deploy/local-diagnostics.py,target=/local-diagnostics.py,readonly" \
            --mount "type=bind,source=$PWD/deploy/unsupported-acceptance.py,target=/unsupported-acceptance.py,readonly" \
            "$TEST_IMAGE" sh /container-acceptance.sh | tee acceptance.txt
          cat acceptance.txt >> "$GITHUB_STEP_SUMMARY"

  booted:
    name: Ordinary user in booted ${{ matrix.distro }}
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian 13
            image: debian/13/cloud
          - distro: Ubuntu 24.04
            image: ubuntu/24.04/cloud
          - distro: Fedora 44
            image: fedora/44/cloud
          - distro: Alpine 3.24
            image: alpine/3.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-bundle-preview-*
          merge-multiple: true
          path: host-parts
      - name: Verify and reconstruct the release transport
        run: |
          (cd host-parts && sha256sum -c PARTS.sha256)
          cat host-parts/part? > host-transport.tar
          sha256sum -c host-parts/TRANSPORT.sha256
          mkdir host-artifacts
          tar -xf host-transport.tar -C host-artifacts
          (cd host-artifacts && sha256sum -c SHA256SUMS)
      - name: Boot and run the ordinary-user acceptance
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: bash deploy/booted-acceptance.sh "$TEST_IMAGE"

  server:
    name: Domainless sudo bootstrap
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: host-bundle-preview-*
          merge-multiple: true
          path: host-parts
      - name: Verify and reconstruct the release transport
        run: |
          (cd host-parts && sha256sum -c PARTS.sha256)
          cat host-parts/part? > host-transport.tar
          sha256sum -c host-parts/TRANSPORT.sha256
          mkdir host-artifacts runtime server-artifacts
          tar -xf host-transport.tar -C host-artifacts
          (cd host-artifacts && sha256sum -c SHA256SUMS)
          tar -xzf host-artifacts/pryx-bundle-linux-x64.tar.gz -C runtime
          for name in pryxd pryx-agent; do cp "runtime/bin/$name" "server-artifacts/$name"; done
          for name in pryx pryx-control pryx-edge; do cp "runtime/bin/$name.real" "server-artifacts/$name"; done
          tar -czf server-artifacts/pryx-control-assets.tar.gz -C runtime control
          cp host-artifacts/install.sh server-artifacts/install.sh
          # Like the existing one-box preview, local enrollment never claims remote release trust.
          head -c 64 /dev/zero > server-artifacts/pryxd.sig
          head -c 64 /dev/zero > server-artifacts/pryxd.bootstrap.sig
          (cd server-artifacts && sha256sum -- * > SHA256SUMS)
      - name: Install with sudo, run hello through aliases and repeat
        run: |
          umask 077
          docker pull -q mirror.gcr.io/library/alpine:3.22
          docker tag mirror.gcr.io/library/alpine:3.22 alpine:3.22
          python3 -m http.server 9876 --bind 127.0.0.1 --directory server-artifacts > "$RUNNER_TEMP/artifact-server.log" 2>&1 &
          printf 'Defaults env_keep += "PRYX_RELEASE_BASE_URL"\n' | sudo tee /etc/sudoers.d/pryx-ci-artifacts >/dev/null
          export PRYX_RELEASE_BASE_URL=http://127.0.0.1:9876
          started=$(date +%s)
          curl --retry 5 --retry-connrefused -fsS "$PRYX_RELEASE_BASE_URL/install.sh" | sudo sh | tee "$RUNNER_TEMP/first-install.log" >/dev/null
          [ "$(pryx run --image alpine:3.22 -- echo hello)" = hello ]
          key_before=$(pryx config key | sha256sum)
          sudo pryx up --preset server | tee "$RUNNER_TEMP/repeat-install.log" >/dev/null
          [ "$(pryx config key | sha256sum)" = "$key_before" ]
          if grep -q '^export PRYX_API_KEY=pryx_' "$RUNNER_TEMP/repeat-install.log"; then echo 'Repeated initial key'; exit 1; fi
          [ "$(pryx run --image alpine:3.22 -- echo hello)" = hello ]
          echo "Domainless server seconds to hello: $(($(date +%s)-started))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Private-service diagnostics after failure
        if: failure()
        run: |
          for unit in pryxd pryx-control pryx-edge pryx-postgres pryx-store; do
            sudo systemctl status "$unit" --no-pager --lines=0 || true
          done
