name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # A merge queue tests the pull request merged onto main's head, with the same jobs and names.
  merge_group:
  # Weekly, so supply-chain sees a new RustSec advisory in a quiet week too, and contract sees a
  # control plane that moved; and on demand.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A worker branch needs only its newest push or proof: a newer one cancels the run in progress.
  # Elsewhere a run is never cancelled; a newer one waits, and only the newest waiting run is kept.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/k') || startsWith(github.ref, 'refs/heads/codex/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A change to nothing but prose skips the rest, and `scope` says which of the rest this run needs.
  # `check` still reports, so it can stay required.
  changes:
    name: Find what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/pull_request_template.md'
              - '!.github/dependabot.yml'
      # full: every job. quick: a worker branch's push (k and a digit, or codex/), whose proof is a
      # dispatch of CI, Any host, VM experiments and Rootless engines on the branch: the jobs below
      # but the installed product's acceptance, the arm64 image and the gVisor tier. none: a pull
      # request from such a branch of this repository, whose push and proof runs test its commits:
      # only what reads the pull request itself.
      - name: Which jobs this run needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          HEAD: ${{ github.head_ref }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          scope=full
          case "$EVENT:$BRANCH" in push:k[0-9]*|push:codex/*) scope=quick ;; esac
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPOSITORY" = true ]; then
            case "$HEAD" in k[0-9]*|codex/*) scope=none ;; esac
          fi
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Format, lint, tests and structure
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Report native journal prerequisites before compilation; unsupported hosts stay unknown.
      - name: Native journal host metadata
        continue-on-error: true
        run: |
          sudo python3 -I - <<'PY'
          import asyncio, itertools, json, os, re, stat
          async def bounded(stream):
              try: return await stream.readexactly(16385)
              except asyncio.IncompleteReadError as error: return error.partial
          async def capture(*args):
              process = None
              try:
                  async with asyncio.timeout(3):
                      process = await asyncio.create_subprocess_exec('/usr/bin/journalctl', *args, stdin=asyncio.subprocess.DEVNULL, stdout=asyncio.subprocess.PIPE, stderr=asyncio.subprocess.PIPE, env={}, limit=16384)
                      out, err = await asyncio.gather(bounded(process.stdout), bounded(process.stderr))
                      if max(len(out), len(err)) > 16384: raise ValueError
                      return {'exit_status': await process.wait(), 'stdout_bytes': len(out), 'stderr_bytes': len(err)}, out
              except (OSError, TimeoutError, ValueError):
                  if process and process.returncode is None:
                      try: process.kill(); await asyncio.wait_for(process.wait(), 1)
                      except (OSError, TimeoutError): pass
                  return {'exit_status': None, 'stdout_bytes': None, 'stderr_bytes': None}, b''
          def store(path):
              try:
                  with os.scandir(path) as children: machines = list(itertools.islice(children, 16))
                  entries = []
                  for machine in machines:
                      if re.fullmatch(r'[0-9a-f]{32}', machine.name) and machine.is_dir(follow_symlinks=False):
                          with os.scandir(machine.path) as files: entries.extend((entry.name, entry.is_file(follow_symlinks=False)) for entry in itertools.islice(files, 128 - len(entries)))
                  names = [name for name, regular in entries if regular and name.startswith('system') and name.endswith('.journal')]
                  return {'system_journals': len(names), 'current_system_journal': 'system.journal' in names, 'scan_limit_reached': len(machines) == 16 or len(entries) == 128}
              except OSError: return None
          report = {'euid': os.geteuid(), 'paths': [], 'pid1_exe': None, 'same_pid_namespace': None}
          for path in '/ /usr /usr/bin /usr/bin/journalctl /usr/lib /usr/lib/systemd /usr/lib/systemd/systemd /bin /bin/journalctl /run /run/log /run/log/journal /var /var/log /var/log/journal'.split():
              entry = {'path': path, 'exists': None, 'uid': None, 'mode': None, 'type': None}
              try:
                  metadata = os.lstat(path)
                  entry.update(exists=True, uid=metadata.st_uid, mode=oct(stat.S_IMODE(metadata.st_mode)), type=stat.filemode(metadata.st_mode)[0])
              except FileNotFoundError: entry['exists'] = False
              except OSError: pass
              report['paths'].append(entry)
          try: report['pid1_exe'] = os.path.basename(os.readlink('/proc/1/exe'))
          except OSError: pass
          try: own, init = os.stat('/proc/self/ns/pid'), os.stat('/proc/1/ns/pid'); report['same_pid_namespace'] = (own.st_dev, own.st_ino) == (init.st_dev, init.st_ino)
          except OSError: pass
          result, version = asyncio.run(capture('--version')); match = re.match(rb'systemd ([0-9]{1,6})(?:\s|$)', version) if result['exit_status'] == 0 else None
          report['journalctl_version'] = match[1].decode('ascii') if match else None
          report['sync'], _ = asyncio.run(capture('--system', '--sync'))
          report['journal_stores'] = {path: store(path) for path in ('/run/log/journal', '/var/log/journal')}
          print(json.dumps(report, sort_keys=True))
          PY
      # rust-toolchain.toml names the one Rust, with clippy and rustfmt; rustup installs it from there.
      - name: Rust from rust-toolchain.toml
        id: rust
        run: |
          rustup toolchain install
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The release image builds with its own Rust, from the Dockerfile's base image tag.
      - name: The Dockerfile's Rust is the same
        env:
          RUST: ${{ steps.rust.outputs.version }}
        run: grep -q "^FROM mirror.gcr.io/library/rust:$RUST-" Dockerfile || { grep '^FROM ' Dockerfile; exit 1; }
      # Keyed on the toolchain too: a new rustc can't reuse the old one's artifacts, and an exact
      # key hit never saves, so without it a Rust bump would rebuild everything on every run until
      # Cargo.lock changed. A Cargo.lock change starts from the last cache of the same Rust.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: test-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ steps.rust.outputs.version }}-
      - run: cargo fmt --check
      # The process tier's embedded programs are bpf/network.bpf.c as the pinned distribution
      # toolchain compiles it (docs/decisions.md, K31), so the object is reviewed as its source.
      - name: The BPF object is its source, compiled
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18=1:18.1.3-1ubuntu1 llvm-18=1:18.1.3-1ubuntu1 libbpf-dev=1:1.3.0-2build2
          sh bpf/build.sh
          git diff --exit-code -- bpf/network.bpf.o bpf/rejected.bpf.o
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Again as the release builds it, without the fake runtime. The tests turn it on for every
      # target above, so something only the fake runtime uses is caught only here.
      - run: cargo clippy --locked -- -D warnings
      # One implementation of the structure rules for both repositories: Cubepals'
      # scripts/check-structure.ts, which reads a repository that is one crate as this one, against
      # structure-baseline.json here. --rust holds clippy's complexity lints to it too. Pinned to a
      # cubepals commit, so a change to the rules reaches this repository as a change here. The Bun
      # that runs it is Cubepals' own (its package.json's packageManager), raised with it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # A workflow GitHub can't parse fails without running and is easy to miss.
      - name: Workflows parse and their scripts pass shellcheck
        env:
          CURL_HOME: ${{ runner.temp }}/pryx-upstream-curl
          PRYX_ASSET_API_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 "$CURL_HOME"
          install -m 600 .github/download.curlrc "$CURL_HOME/.curlrc"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url=$(jq -r .url .github/actionlint-release.json)
          digest=$(jq -r .sha256 .github/actionlint-release.json)
          curl -sSL -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $PRYX_ASSET_API_TOKEN" "$url" -o "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
          unset PRYX_ASSET_API_TOKEN
          install -d -m 700 "$RUNNER_TEMP/pryx-actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pryx-actionlint" actionlint LICENSE.txt
          "$RUNNER_TEMP/pryx-actionlint/actionlint" -color
      # Every file says whose it is and under what license, by its own SPDX lines or REUSE.toml.
      - name: Licenses
        run: pipx run reuse==6.2.0 lint
      # AGENTS.md's "Values from elsewhere", where a grep can see it: Example port constants outside
      # their one definition (formats.rs and its fixtures pin bytes), Docker's errors matched
      # outside the runtime that classifies them, HTTP statuses as numbers.
      - name: Values from elsewhere
        run: |
          if git grep -nwE '25565|25575' -- src tests examples deploy ':!src/examples.rs' ':!tests/formats.rs' ':!tests/fixtures'; then exit 1; fi
          if git grep -n 'DockerResponseServerError' -- src tests ':!src/runtime/docker.rs'; then exit 1; fi
          if git grep -nE '(status|status_code|code)(: *| *== *)[1-5][0-9]{2}\b|as_u16\(\) *[=!<>]=? *[0-9]|\.status, *[1-5][0-9]{2}\b' -- src tests; then exit 1; fi
      # A length of time comes from std's Duration::from_mins/from_hours or a named constant, not
      # a hand-written 3600 or 86_400; and a comment says why, not who decided it.
      - name: Durations and comments
        run: |
          if git grep -nE '\b(3_?600|86_?400|604_?800)\b|\b60 ?\* ?60\b' -- '*.rs'; then exit 1; fi
          # This digest-locked upstream legal text contains the literal phrase; preserve it verbatim.
          if git grep -niE "owner'?s decision|owner decided|per the owner|as requested" -- . ':!.github/workflows/ci.yml' ':!templates/process-tools/notices/desktop-full/libglib2.0-0.copyright'; then exit 1; fi
      - name: Structure
        run: |
          curl -fsSL https://raw.githubusercontent.com/cubepals/cubepals/e264c475d05aa31ec8871b2ceb8c421cf7370200/scripts/check-structure.ts \
            -o "$RUNNER_TEMP/check-structure.ts"
          bun "$RUNNER_TEMP/check-structure.ts"
          bun "$RUNNER_TEMP/check-structure.ts" --rust
      # As the runner's own user, not root: data goes to the test's user (tests/support). Every
      # test binary runs even after one fails, so a failure can't hide the others.
      - name: Stage the verified agentOS distribution
        run: python3 scripts/fetch-agentos.py "$RUNNER_TEMP/agentos"
      # K19 uses the free hosted runner's real KVM device; no VM service or paid runner.
      - name: Allow the runner user to probe KVM
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
      - run: |
          printf 'EXEC_OWNER_KERNEL suid_dumpable='
          if ! cat /proc/sys/fs/suid_dumpable 2>/dev/null; then
            printf 'unavailable\n'
          fi
          cargo test --locked --no-fail-fast
        env:
          PRYX_AGENTOS_DISTRIBUTION: ${{ runner.temp }}/agentos
          PRYX_PROBE_KVM: 'on'
          PRYX_PRIVATE_IPC_REPORT: ${{ runner.temp }}/process-ipc-design.json
      # K31: process sandboxes' kernel network policy on this runner's kernel, as root and as an
      # ordinary user with CAP_BPF, CAP_NET_ADMIN and a delegated cgroup, against real
      # destinations: a private address in its own namespace, the host's own address and
      # loopback, link-local metadata and the internet.
      - name: Destinations for the kernel network policy
        id: kernel-destinations
        run: |
          uname -r | tee -a "$GITHUB_STEP_SUMMARY"
          sudo ip netns add pryx-private
          sudo ip link add pryx-host type veth peer name pryx-guest netns pryx-private
          sudo ip address add 10.213.0.1/24 dev pryx-host
          sudo ip link set pryx-host up
          sudo ip netns exec pryx-private ip address add 10.213.0.2/24 dev pryx-guest
          sudo ip netns exec pryx-private ip link set pryx-guest up
          sudo ip netns exec pryx-private ip link set lo up
          for port in 8000 8001; do
            sudo ip netns exec pryx-private python3 -m http.server "$port" --bind 10.213.0.2 \
              --directory "$RUNNER_TEMP" > /dev/null 2>&1 &
            curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -o /dev/null "http://10.213.0.2:$port/"
          done
          # The same namespace stands in for another machine: asked on 8002, it dials this host at
          # 10.213.0.1 as the edge would and says what it got, or (/udp) sends a datagram to the
          # port from each source port named, as that many peers elsewhere.
          cat > "$RUNNER_TEMP/dial.py" <<'PY'
          import http.server, socket, urllib.parse
          class Dial(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  url = urllib.parse.urlsplit(self.path)
                  query = urllib.parse.parse_qs(url.query)
                  port = int(query['port'][0])
                  if url.path == '/udp':
                      for source in query['from'][0].split(','):
                          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as peer:
                              peer.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                              peer.bind(('10.213.0.2', int(source)))
                              peer.sendto(source.encode(), ('10.213.0.1', port))
                      self.answer('sent')
                      return
                  try:
                      dialled = socket.create_connection(('10.213.0.1', port), timeout=3)
                  except OSError as error:
                      answer = f'unreached {error}'
                  else:
                      with dialled:
                          answer = 'reached'
                          try:
                              dialled.settimeout(3)
                              dialled.sendall(b'GET /_pryx/health HTTP/1.0\r\nHost: edge\r\n\r\n')
                              answer += ' ' + dialled.recv(64).decode(errors='replace').split('\r\n')[0]
                          except OSError:
                              pass
                  self.answer(answer)
              def answer(self, answer):
                  body = answer.encode()
                  self.send_response(200)
                  self.send_header('content-length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          http.server.ThreadingHTTPServer(('10.213.0.2', 8002), Dial).serve_forever()
          PY
          sudo ip netns exec pryx-private python3 "$RUNNER_TEMP/dial.py" > /dev/null 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -o /dev/null "http://10.213.0.2:8002/dial?port=9"
          sudo install -D -m 0755 target/debug/pryx-agent /usr/local/lib/pryx-k31/pryx-agent
          {
            echo 'PRYX_TEST_PRIVATE=10.213.0.2:8000:8001'
            echo 'PRYX_TEST_REMOTE=10.213.0.2:8002'
            echo 'PRYX_TEST_EDGE=10.213.0.1'
            echo "PRYX_TEST_HOST_ADDRESS=$(ip -4 route get 1.1.1.1 | sed -n 's/.* src \([0-9.]*\).*/\1/p')"
          } >> "$GITHUB_ENV"
      - name: Kernel network policy as root
        env:
          PRYX_TEST_AGENT: /usr/local/lib/pryx-k31/pryx-agent
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo --preserve-env=PRYX_TEST_AGENT,PRYX_TEST_PRIVATE,PRYX_TEST_HOST_ADDRESS,PRYX_TEST_REMOTE,PRYX_TEST_EDGE
        run: |
          cargo test --locked --lib bpf:: -- --ignored
          cargo test --locked --lib runtime::process::network \
            -- --ignored --test-threads 1
          # The stale-map route case asserts its first and every repeated packet is refused.
          cargo test --locked --test process_network -- --ignored --test-threads 1 --nocapture
          # Retain actual service status and reports; verify a same-PID read denial before
          # exec, and require the unmasked service with the same privileges to prove policy on.
          python3 scripts/check-address-table-probes-test.py
          sudo install -m 0755 target/debug/pryxd /usr/local/lib/pryx-k31/pryxd
          sudo install -m 0644 scripts/check-address-table-probes.py /usr/local/lib/pryx-k31/check-address-table-probes.py
          sudo python3 /usr/local/lib/pryx-k31/check-address-table-probes.py \
            /usr/local/lib/pryx-k31/pryxd "$RUNNER_TEMP/kernel-address-probes"
      # Disposable runner prerequisite, as a host's root would grant it: a pin directory the
      # user owns on the system's BPF filesystem, and a service with the two capabilities.
      # Both suites run whichever fails, so one can't hide the other.
      - name: Kernel network policy as a delegated ordinary user
        if: ${{ !cancelled() && steps.kernel-destinations.outcome == 'success' }}
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /sys/fs/bpf/pryx
          sudo chmod o+x /sys/fs/bpf
          # The one test binary of pryxd's target named $1 (the bin it also builds is not it).
          executable() {
            cargo test --locked -p pryxd "${@:2}" --no-run --message-format=json \
              | jq -r --arg name "$1" 'select(.reason == "compiler-artifact" and .profile.test
                  and .target.name == $name and .executable != null) | .executable'
          }
          library=$(executable pryxd --lib)
          policy=$(executable process_network --test process_network)
          for run in "$library bpf:: --ignored" "$policy --ignored --test-threads 1"; do
            # shellcheck disable=SC2086 # each run is a program and its arguments
            sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
              -p Delegate=yes -p AmbientCapabilities="CAP_BPF CAP_NET_ADMIN" \
              --working-directory="$PWD" --setenv=HOME="$HOME" --setenv=PATH="$PATH" \
              --setenv=PRYX_TEST_AGENT="$PWD/target/debug/pryx-agent" \
              --setenv=PRYX_TEST_PRIVATE="$PRYX_TEST_PRIVATE" \
              --setenv=PRYX_TEST_HOST_ADDRESS="$PRYX_TEST_HOST_ADDRESS" \
              --setenv=PRYX_TEST_REMOTE="$PRYX_TEST_REMOTE" --setenv=PRYX_TEST_EDGE="$PRYX_TEST_EDGE" \
              $run
          done
      # The server preset's unit grants it too: the suite's public-internet-off and off-the-host
      # cases as root in a service named as it is, under every [Service] setting of
      # deploy/pryxd.service but how it starts and stops.
      - name: Kernel network policy under the installed root unit
        if: ${{ !cancelled() && steps.kernel-destinations.outcome == 'success' }}
        run: |
          policy=$(cargo test --locked -p pryxd --test process_network --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "process_network"
                and .executable != null) | .executable')
          # The unit hides /home, so the suite runs from where the agent is.
          sudo install -m 0755 "$policy" /usr/local/lib/pryx-k31/process_network
          mapfile -t settings < <(sed -n '/^\[Service\]/,/^\[/p' deploy/pryxd.service | grep -E '^[A-Z]' \
            | grep -Ev '^(Type|Exec[A-Za-z]+|Restart|RestartSec|KillSignal|TimeoutStopSec)=' | sed 's/^/--property=/')
          printf '%s\n' "${settings[@]}"
          sudo systemd-run --unit=pryxd --quiet --wait --pipe --collect "${settings[@]}" \
            --setenv=PRYX_TEST_AGENT=/usr/local/lib/pryx-k31/pryx-agent \
            --setenv=PRYX_TEST_PRIVATE="$PRYX_TEST_PRIVATE" \
            --setenv=PRYX_TEST_REMOTE="$PRYX_TEST_REMOTE" --setenv=PRYX_TEST_EDGE="$PRYX_TEST_EDGE" \
            /usr/local/lib/pryx-k31/process_network --ignored --test-threads 1 \
            without_public_internet from_off_the_host
      - name: Save process IPC design evidence
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: process-ipc-design
          path: |
            ${{ runner.temp }}/process-ipc-design.json
            ${{ runner.temp }}/check-structure.ts
            target/check-control-structure.ts
            ${{ runner.temp }}/kernel-address-probes/
          if-no-files-found: warn
      # K26: the process tier's namespaced mode on this runner, and its plain mode in a default
      # docker run, against the agent built above with the pinned helper staged beside it. Where
      # Ubuntu's AppArmor rule refuses the helper, the profile the doctor prints is installed first.
      - name: Process sandboxes namespaced here and plain in a default docker run
        id: process-namespaces
        run: |
          install -d -m 755 "$RUNNER_TEMP/pryx-install"
          install -m 755 target/debug/pryx-agent "$RUNNER_TEMP/pryx-install/pryx-agent"
          python3 -I deploy/namespace-helper.py "$RUNNER_TEMP/pryx-install"
          cc -fPIC -shared tests/fixtures/process-loader.c -o "$RUNNER_TEMP/pryx-install/process-loader.so"
          cc -DPRYX_LOADER_PROGRAM tests/fixtures/process-loader.c -o "$RUNNER_TEMP/pryx-install/process-loader-check"
          export PRYX_TEST_PROCESS_AGENT="$RUNNER_TEMP/pryx-install/pryx-agent"
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          PRYX_TEST_NAMESPACE_PROFILE="$RUNNER_TEMP/pryx-namespaces.apparmor" \
            cargo test --locked --test process_namespaces -- --ignored --nocapture --test-threads 1
          if [ -s "$RUNNER_TEMP/pryx-namespaces.apparmor" ]; then
            cat "$RUNNER_TEMP/pryx-namespaces.apparmor"
            sudo install -m 644 "$RUNNER_TEMP/pryx-namespaces.apparmor" /etc/apparmor.d/pryx-namespaces
            sudo apparmor_parser -r /etc/apparmor.d/pryx-namespaces
          fi
          PRYX_TEST_NAMESPACES=on cargo test --locked --test process_namespaces -- --ignored --nocapture --test-threads 1
          test=$(cargo test --locked --test process_namespaces --no-run --message-format=json \
            | jq -r 'select(.target.name == "process_namespaces" and .executable != null) | .executable')
          echo "plain-mode test binary: $test"
          test -f "$test" && test -x "$test"
          for wait in 2 5 10 20 0; do
            docker pull -q mirror.gcr.io/library/ubuntu:24.04 && break
            [ "$wait" = 0 ] && exit 1
            sleep "$wait"
          done
          docker run --rm -v "$RUNNER_TEMP/pryx-install:/install:ro" -v "$test:/process-namespaces:ro" \
            -e PRYX_TEST_NAMESPACES=off -e PRYX_TEST_PROCESS_AGENT=/opt/pryx/pryx-agent \
            mirror.gcr.io/library/ubuntu:24.04 sh -c 'cp -r /install /opt/pryx && exec /process-namespaces --ignored --nocapture --test-threads 1'
      # K31 with K26: the policy suite's public-internet-off and off-the-host cases again, as the
      # delegated user, against the agent above with its helper, so every supervisor starts
      # namespaced (the profile above admits the helper) and must still get its own programs.
      - name: Kernel network policy on namespaced process sandboxes
        # Needs the agent and helper the step above stages, and the profile it installs.
        if: ${{ !cancelled() && steps.kernel-destinations.outcome == 'success' && steps.process-namespaces.outcome == 'success' }}
        run: |
          policy=$(cargo test --locked -p pryxd --test process_network --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "process_network"
                and .executable != null) | .executable')
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            -p Delegate=yes -p AmbientCapabilities="CAP_BPF CAP_NET_ADMIN" \
            --working-directory="$PWD" --setenv=HOME="$HOME" --setenv=PATH="$PATH" \
            --setenv=PRYX_TEST_AGENT="$RUNNER_TEMP/pryx-install/pryx-agent" --setenv=PRYX_TEST_NAMESPACES=on \
            --setenv=PRYX_TEST_PRIVATE="$PRYX_TEST_PRIVATE" \
            --setenv=PRYX_TEST_REMOTE="$PRYX_TEST_REMOTE" --setenv=PRYX_TEST_EDGE="$PRYX_TEST_EDGE" \
            "$policy" --ignored --test-threads 1 without_public_internet from_off_the_host
      - name: CLI doctor uses the real host document
        run: |
          bun install --frozen-lockfile
          PRYX_PRYXD_BIN="$PWD/target/debug/pryxd" bun cli/src/main.ts doctor --json > "$RUNNER_TEMP/host-probe.json"
          jq -e '.capabilities.kvm.state == "on"' "$RUNNER_TEMP/host-probe.json"
          jq -e '.tiers | has("container") and has("process") and has("wasm")' "$RUNNER_TEMP/host-probe.json"
      # Against the runner's own Docker daemon: hardening, limits, the OOM killer, isolation,
      # restarts. They chown data directories, so Cargo's runner starts the test binary as root;
      # Cargo itself, and so target/, stays the runner's.
      # The Docker suites run whatever the process case found, so one run shows both.
      - name: Docker integration tests
        if: ${{ !cancelled() }}
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=sudo cargo test --locked --test docker -- --ignored --test-threads 2
      # K26: the same suite on the gvisor tier, with gVisor's runsc at deploy/gvisor.json's pin
      # registered with the runner's Docker. Last, since registering it restarts Docker. In full runs
      # only: a worker branch's quick push leaves the gvisor tier to its proof.
      - name: Register gVisor's runsc with Docker
        if: ${{ !cancelled() && needs.changes.outputs.scope == 'full' }}
        run: sudo deploy/gvisor.sh
      - name: Docker integration tests on the gvisor tier
        if: ${{ !cancelled() && needs.changes.outputs.scope == 'full' }}
        timeout-minutes: 40
        env:
          PRYX_TEST_GVISOR: '1'
        run: >-
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER='sudo --preserve-env=PRYX_TEST_GVISOR'
          cargo test --locked --test docker -- --ignored --test-threads 2 --nocapture
      # Upgrade between two pinned releases with a sandbox running; actual host executables
      # must keep the old version there and use the server preset's new pin on a new sandbox.
      - name: gVisor runtime path upgrade
        if: ${{ !cancelled() && needs.changes.outputs.scope == 'full' }}
        run: sudo env "PATH=$PATH" bun deploy/gvisor-upgrade.ts
      - name: Docker and kernel failure evidence
        if: failure()
        run: |
          sudo journalctl -u docker --since '-10 min' --no-pager -n 80
          docker version
          docker info --format '{{json .CgroupVersion}} {{json .CgroupDriver}}'
          timeout 15s docker events --format '{{.TimeNano}} {{.Action}} {{.Actor.ID}}' --since 10m --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --filter type=container --filter event=oom
          sudo dmesg --ctime | tail -240

  # K31: the same object loads on the oldest hosted kernel too; the test job covers
  # ubuntu-24.04's. A verifier rejection fails the test with the verifier's log.
  kernels:
    name: BPF programs on ${{ matrix.runner }}'s kernel
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scope != 'none'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust from rust-toolchain.toml
        id: rust
        run: |
          rustup toolchain install
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: kernels-${{ matrix.runner }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: kernels-${{ matrix.runner }}-${{ steps.rust.outputs.version }}-
      - name: Load, attach and detach every program as root
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          uname -r | tee -a "$GITHUB_STEP_SUMMARY"
          cargo test --locked --lib bpf:: -- --ignored

  supply-chain:
    name: Dependency licences and advisories
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust from rust-toolchain.toml
        run: rustup toolchain install
      # The release's own binary, not a build from source on every run.
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      # Advisories (RustSec), licenses, banned crates and sources: deny.toml.
      - run: cargo deny --locked check

  contract:
    name: Contract with the control plane
    # Cubepals' control plane, from its main, against this pryxd, for real: enrollment over
    # mutual TLS, placement, snapshots, restores, a daemon killed and back, a node held lost, a
    # self-upgrade (apps/control/src/infra/fleet/fleet-runtime.e2e.test.ts there). A debug build,
    # since only debug builds take PRYXD_TEST_VERSION, which the upgrade test sets.
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: blockly
          POSTGRES_PASSWORD: blockly
          POSTGRES_DB: blockly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blockly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://blockly:blockly@127.0.0.1:5432/blockly
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      # pryxd hands data directories to the workloads' user, so it runs as root.
      BLOCKLYD_SUDO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pryxd
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubepals/cubepals
          ref: main
          path: cubepals
          persist-credentials: false
      - name: Rust from rust-toolchain.toml
        id: rust
        working-directory: pryxd
        run: |
          rustup toolchain install
          echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # As test's: the toolchain is in the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            pryxd/target
          key: contract-${{ steps.rust.outputs.version }}-${{ hashFiles('pryxd/Cargo.lock') }}
          restore-keys: contract-${{ steps.rust.outputs.version }}-
      - run: cargo build --locked
        working-directory: pryxd
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
      # Docker Hub caps anonymous pulls per IP and runners share IPs, so these come from mirrors.
      # Mirrors refuse bursts when parallel jobs pull at once, so each pull retries.
      - name: Pull the test images
        run: |
          sh pryxd/scripts/pull-rustfs.sh
          for image in mirror.gcr.io/library/alpine:3.22; do
            for wait in 2 5 10 20 40 0; do
              docker pull -q "$image" && break
              [ "$wait" = 0 ] && exit 1
              sleep "$wait"
            done
          done
          docker tag mirror.gcr.io/library/alpine:3.22 alpine:3.22
      - name: Build the TLS sandbox fixture
        run: |
          printf 'FROM mirror.gcr.io/library/alpine:3.22\nRUN apk add --no-cache openssl busybox-extras ca-certificates git curl\n' > "$RUNNER_TEMP/tls.Dockerfile"
          docker build -t alpine:pryx-tls -f "$RUNNER_TEMP/tls.Dockerfile" "$RUNNER_TEMP"
      - name: Start an S3 store
        run: >-
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=blockly-test
          -e RUSTFS_SECRET_KEY=blockly-test-secret ghcr.io/rustfs/rustfs:1.0.0 /data
      # Cubepals' own bun, from its packageManager field: its bun.lock is written by that version
      # and an older one can't read it.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: cubepals/package.json
      # The node endpoint runs on Node, as in production.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - run: bun install --frozen-lockfile
        working-directory: cubepals
      - run: bun test apps/control/src/infra/fleet/fleet-runtime.e2e.test.ts
        working-directory: cubepals
        env:
          BLOCKLYD_BIN: ${{ github.workspace }}/pryxd/target/debug/pryxd
          BLOCKLYD_E2E_KEEP: '1'
      - name: Bounded upstream fixture diagnostics
        if: failure()
        run: |
          for directory in /tmp/blockly-e2e*; do
            [ -d "$directory" ] || continue
            sudo python3 pryxd/deploy/local-diagnostics.py "$directory"
          done
          directory="$RUNNER_TEMP/contract-diagnostics"
          install -d -m 700 "$directory"
          docker logs --tail 80 s3 > "$directory/s3.log" 2>&1 || true
          python3 pryxd/deploy/local-diagnostics.py "$directory"

  # The image a release publishes builds, and its binary is static. Not on main's own push, where
  # release.yml builds it.
  control:
    name: Control workspaces
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: pryx
          POSTGRES_PASSWORD: pryx-test
          POSTGRES_DB: pryx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pryx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pryx:pryx-test@127.0.0.1:5432/pryx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
      - run: bun install --frozen-lockfile
      - run: bun run release:build
      - run: bun run check
      - name: Python generation and unit tests
        run: |
          python3 -m venv .venv-python
          .venv-python/bin/pip install -r sdk/python/generator-requirements.lock
          .venv-python/bin/pip install -e sdk/python
          PATH="$PWD/.venv-python/bin:$PATH" python3 sdk/python/generate.py check
          .venv-python/bin/python -m unittest discover -s sdk/python/test -v
      - run: bun scripts/check-control-structure.ts

  # The installed product's acceptance, in ci-acceptance.yml: one build of the daemon and release
  # image, the end-to-end suites and the one-box install.
  acceptance:
    name: Acceptance
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.scope == 'full'
    uses: ./.github/workflows/ci-acceptance.yml
    secrets: inherit

  image:
    name: Release image builds
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && needs.changes.outputs.scope == 'full' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    # The release publishes the image for both machines, each built natively on GitHub's standard
    # runner for it (free for this public repository). x86_64's is Acceptance's build, which runs
    # whenever this does.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t pryxd .
      - run: docker run --rm pryxd --version

  # The pull request's title becomes the squash commit's subject on main, and its body the commit's
  # body, so they follow the rules lefthook's commit-msg hook holds commits to:
  # scripts/check-subject.sh for the title, scripts/check-mentions.sh for both. Bots' are their own.
  # Both are untrusted text: they reach the scripts through the environment, never the shell.
  subject:
    name: Commit subjects
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-subject-test.sh
      - run: scripts/check-mentions-test.sh
      - name: The pull request's title fits
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | scripts/check-subject.sh
      - name: The pull request's title and body mention nobody
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-mentions.sh --pr

  check:
    needs: [changes, test, supply-chain, contract, subject, image, control, acceptance]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every part passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
