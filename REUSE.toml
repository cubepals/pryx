# What isn't Rust and can't carry its own license lines (configuration, fixtures, the lockfile,
# docs, the API's description, CI): all of it is pryxd's, under the same license as the code.
# `reuse lint` checks every file is covered, by its own lines or by this.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The Cubepals Authors"
SPDX-License-Identifier = "FSL-1.1-ALv2"

[[annotations]]
path = "templates/node-interpreter/notices/canvas.txt"
SPDX-FileCopyrightText = ["2020 LongYinan", "2015 The Chromium Authors"]
SPDX-License-Identifier = "MIT AND BSD-3-Clause"

[[annotations]]
path = "templates/node-interpreter/notices/skia.txt"
SPDX-FileCopyrightText = "2011 Google Inc."
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "templates/native-tools/notices/**"
precedence = "override"
SPDX-FileCopyrightText = "Upstream contributors (see each retained notice)"
SPDX-License-Identifier = "LicenseRef-Third-Party-Notices"

[[annotations]]
path = "deploy/native-tools-seccomp.json"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation and Docker contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "deploy/pryx-native-tools.apparmor"
precedence = "override"
SPDX-FileCopyrightText = "The Moby Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "deploy/notices/**"
precedence = "override"
SPDX-FileCopyrightText = "Upstream contributors (see each retained notice)"
SPDX-License-Identifier = "LicenseRef-Third-Party-Notices"

[[annotations]]
path = "templates/process-tools/notices/**"
precedence = "override"
SPDX-FileCopyrightText = "Upstream contributors (see each retained notice)"
SPDX-License-Identifier = "LicenseRef-Third-Party-Notices"
