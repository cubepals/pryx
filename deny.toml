# What pryxd may depend on (`cargo deny check`, run in CI). pryxd runs as root next to
# Docker's socket on every node, so its dependencies are part of every node's attack surface.
#
# Lockfile policy: Cargo.lock is committed and every build and test runs with --locked. A
# dependency changes only in a commit that changes Cargo.lock on purpose, and passes this check.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = false

[advisories]
# RustSec. A known vulnerability, or a crate its authors withdrew, fails the build.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only, so shipping pryxd's binary to hosts carries no obligations beyond
# its own license and the notices.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# Both are permissive and reviewed at the locked version: notify's public-domain dedication,
# and the terminfo parser used by the embedded shell. Broader dependencies retain the allowlist.
[[licenses.exceptions]]
crate = "notify@8.2.1"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "terminfo@0.9.0"
allow = ["WTFPL"]

# The linked client's Mozilla CA data permits redistribution with this licence text.
# Reviewed at the locked version; this does not allow other crates under the exception.
[[licenses.exceptions]]
crate = "webpki-roots@1.0.11"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# pryxd itself (FSL-1.1-ALv2, LICENSE.md; publish = false) isn't checked against the list above.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # TLS is rustls with ring: no OpenSSL to patch on every host.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
