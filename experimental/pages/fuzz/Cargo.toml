[workspace]

[package]
name = "pryx-page-fuzz"
edition = "2024"
version = "0.1.0"
publish = false
license = "FSL-1.1-ALv2"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
pryx-page-kernels = { path = "..", features = ["page-kernels"] }

[[bin]]
name = "page"
path = "targets/page.rs"
test = false
doc = false
bench = false
