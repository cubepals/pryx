[workspace]
members = ["machine"]
default-members = ["."]

[package]
name = "pryx-lab-codegen"
version = "0.1.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[features]
default = []
experimental = ["dep:pryx-page-generator", "dep:tempfile"]

[dependencies]
pryx-page-generator = { path = "machine", optional = true }

[[bin]]
name = "pryx-codegen"
path = "src/main.rs"
required-features = ["experimental"]

[dependencies.tempfile]
version = "=3.27.0"
optional = true

[dev-dependencies]
libc = "=0.2.191"
