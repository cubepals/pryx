# fly launch assigns the globally unique app name; keep one machine and its volume together.
primary_region = "ams"
[build]
  image = "ghcr.io/cubepals/pryx:0.1.0"
[env]
  PORT = "8080"
  PRYX_HOSTING_PLATFORM = "fly"
[[mounts]]
  source = "pryx_state"
  destination = "/var/lib/pryx"
  initial_size = "10gb"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
