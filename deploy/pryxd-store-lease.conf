# Install as /etc/systemd/system/pryxd.service.d/store-lease.conf only on a configured lease host.
[Service]
ProtectControlGroups=no
ReadWritePaths=/sys/fs/cgroup
RuntimeDirectory=pryxd-leases
RuntimeDirectoryMode=0700
ReadWritePaths=/run/pryxd-leases
RuntimeDirectoryPreserve=yes
