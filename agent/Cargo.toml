[package]
name = "pryx-agent"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-ALv2"
publish = false
description = "The sandbox's process and file agent"

[dependencies]
async-trait = { version = "0.1", optional = true }
base64 = "0.23"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", default-features = false, features = ["json", "query", "http1", "tokio", "ws"], optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "fs", "io-util", "io-std", "process"], optional = true }
tokio-util = { version = "0.7", features = ["io", "io-util", "rt"], optional = true }
tokio-vsock = { version = "=0.7.3", optional = true }
vsock = { version = "=0.5.5", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
bytes = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rustix = { version = "1", features = ["fs", "process", "thread", "mount", "system"], optional = true }
portable-pty = { version = "0.9", optional = true }
notify = { version = "8", optional = true }
procfs = { version = "0.18", default-features = false, optional = true }
brush-core = { version = "0.5", optional = true }
brush-builtins = { version = "0.2", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "stream"], optional = true }
libc = { version = "0.2.189", optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }
schemars = { version = "=1.2.3", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
httparse = { version = "1", optional = true }
landlock = { version = "0.4.7", optional = true }
nix = { version = "=0.31.3", default-features = false, features = ["sched", "user", "hostname"], optional = true }
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "ed25519", "getrandom"], optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["std"], optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
seccompiler = { version = "0.5.0", optional = true }

jupyter-zmq-client = { version = "=3.0.1", default-features = false, features = ["tokio-runtime", "ring"], optional = true }
jupyter-protocol = { version = "=2.0.3", optional = true }
regex = { version = "1", optional = true }
globset = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
tempfile = { version = "3", optional = true }

[features]
default = ["server", "mcp"]
mcp = ["server"]
fs = ["dep:rustix", "dep:landlock", "dep:tokio"]
schema = ["dep:schemars"]
server = ["dep:flate2", "dep:percent-encoding", "dep:nix", "dep:ssh-key", "dep:chrono", "dep:jupyter-zmq-client", "dep:jupyter-protocol", "dep:regex", "dep:globset", "dep:tar", "dep:tempfile", "dep:async-trait", "fs", "dep:axum", "dep:tokio", "dep:tokio-util", "dep:tokio-vsock", "dep:vsock", "dep:futures-util", "dep:bytes", "dep:uuid", "dep:portable-pty", "dep:notify", "dep:procfs", "dep:brush-core", "dep:brush-builtins", "dep:reqwest", "dep:libc", "dep:clap", "dep:rustls", "dep:httparse", "dep:landlock", "dep:seccompiler"]

[[bin]]
name = "pryx-agent"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
pryx-agent = { path = ".", features = ["schema"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
use_self = "warn"
