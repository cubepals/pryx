<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Native desktop acceptance</title>
<style>input,button { position:fixed;left:100px;width:300px;height:60px } input {top:80px} button {top:200px}</style>
<input aria-label="Observed text"><button>Observe click</button>
<script>
const input = document.querySelector('input'), button = document.querySelector('button')
function observe(value) { return fetch('/observe', { method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(value) }) }
function point(element) { const r=element.getBoundingClientRect();return {x:Math.round(screenX+r.x+r.width/2),y:Math.round(screenY+outerHeight-innerHeight+r.y+r.height/2)} }
input.oninput=()=>observe({kind:'type',value:input.value})
button.onclick=()=>observe({kind:'click'})
window.onload=()=>observe({kind:'ready',input:point(input),button:point(button)})
</script></html>
