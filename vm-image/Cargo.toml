[package]
name = "pryx-vm-image"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-ALv2"
publish = false
description = "The separately bundled pryx VM image preparation helper"

# This helper is built from the same release tag, without unifying its registry
# client's tracing features into the always-running daemon's dependency graph.
[workspace]

[dependencies]
pryxd = { path = "..", default-features = false }
oci-client = { version = "=0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }
oci-spec = { version = "=0.10.0", default-features = false, features = ["image"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
flate2 = "1"
sha2 = "0.11"
hex = "0.4"
libc = "0.2.189"
axum = { version = "0.8", default-features = false }
reqwest = { version = "0.12", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustix = { version = "1", features = ["process", "fs"] }

[dev-dependencies]
pryx-agent = { path = "../agent", default-features = false, features = ["server"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
use_self = "warn"
cast_lossless = "warn"
derive_partial_eq_without_eq = "warn"
redundant_closure_for_method_calls = "warn"
unused_async = "warn"
mod_module_files = "warn"
